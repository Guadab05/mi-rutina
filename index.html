<title>Mi rutina</title>
<style>
/* ============ Tokens ============ */
:root{
  --bg:#F2F1F4; --surface:#FFFFFF; --surface2:#F7F6F9; --ink:#1E1A22; --mut:#6E6873; --line:#E4E1E8;
  --primary:#7A2E4F; --primary-ink:#FFFFFF;
  --mar:#9C3D5A; --jue:#3D4C7D; --sab:#6A4277; --run:#2E7366; --box:#8A8290;
  --warn-bg:#FFF1DC; --warn-ink:#6E420A; --warn-line:#E09A3E;
  --ok:#2E7366; --down:#B5513A; --hold:#6E6873;
  --edit:#2B2530; --track:#E7E5EB; --ok-bg:#E3F1EE; --ok-ink:#1E5249; --hold-bg:#EEEDF1; --hold-ink:#3E3843; --down-bg:#FBE9E6; --down-ink:#7D3020; --body2:#3E3843;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-size:16px;line-height:1.4;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ Layout ============ */
.app{max-width:720px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.topbar h1{font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.topbar .sub{color:var(--mut);font-size:14px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:2px}
.section-title{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title small{font-size:13px;color:var(--mut);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--mut)}
.small{font-size:13px}
.hide{display:none!important}

/* ============ Bottom nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mut);font-size:10px;font-weight:600;min-width:0;white-space:nowrap}
.nav a svg{width:22px!important;height:22px!important}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--primary)}

/* ============ Surfaces ============ */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.card.flat{border:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.pill.c{background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.dash{background:transparent;border:1.5px dashed var(--c);color:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--primary);color:var(--primary-ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:color-mix(in srgb,var(--c,var(--primary)) 12%,var(--surface));color:var(--c,var(--primary))}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--down-bg);color:var(--down-ink)}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{color:var(--primary);font-weight:650;font-size:14.5px;padding:6px 2px;display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut);white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,26,34,.12)}

/* ============ Home ============ */
.hero{border-radius:22px;padding:18px;background:var(--c,var(--primary));color:#fff;position:relative;overflow:hidden}
.hero .k{font-size:13.5px;opacity:.85;font-weight:600}
.hero .t{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .d{font-size:15px;opacity:.92;margin-top:4px}
.hero .btn{background:#fff;color:var(--c,var(--primary));margin-top:14px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{background:rgba(255,255,255,.17);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650}

.wd.today{outline:2.5px solid var(--ink);outline-offset:1px}
.wd.done .dot{background:var(--ok);color:#fff}

.blockbar{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.38}

/* ============ Train hub ============ */
.daybtn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:left;width:100%}

.daybtn .chev{color:var(--mut)}
.daybtn.today{border:2px solid var(--c)}

.ex{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;position:relative}

.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}

.fact .fl{font-size:11.5px;color:var(--mut);font-weight:600}
.fact .fv{font-size:16px;font-weight:750;line-height:1.2}
.fact.w{grid-column:1/-1}
.fact.w .fv{font-size:15px;font-weight:600}
.lastline{margin-top:10px;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lastline b{font-weight:750}
.lastline .muted{font-size:13px}
.tip{margin-top:9px;font-size:14.5px;color:var(--body2);display:flex;gap:7px;line-height:1.38}
.tip svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;color:var(--c)}
.warnline{margin-top:9px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line);border-radius:9px;padding:8px 10px;line-height:1.36;display:flex;gap:7px}
.warnline svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:#C77812}
details.acc{margin-top:10px;border-top:1px solid var(--line)}

details.acc[open] summary .chev{transform:rotate(180deg)}

details.acc summary .sl svg{width:18px;height:18px}
.acc-body{padding:8px 0 2px;display:flex;flex-direction:column;gap:8px}
.acc-body ul{padding-left:18px;font-size:14.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.acc-body h5{font-size:13px;color:var(--mut);font-weight:700}
.note{font-size:14px;background:var(--surface2);border-radius:9px;padding:8px 10px;line-height:1.38;display:flex;gap:7px}
.note svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--c)}
.machnote{font-size:13.5px;color:var(--mut);display:flex;gap:6px;align-items:flex-start}
.machnote svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.grouphead{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-weight:750;font-size:15px;color:var(--c)}

/* ============ Session ============ */
.sess-head{border-radius:22px;padding:16px 18px;background:var(--c);color:#fff;margin-bottom:12px}
.sess-head .t{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sess-head .d{font-size:14.5px;opacity:.9;margin-top:3px}
.sess-head .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.sess-head .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.sess-head .row{margin-top:10px;justify-content:space-between}
.sess-head input[type=date]{background:rgba(255,255,255,.17);border:none;border-radius:10px;color:#fff;padding:7px 10px;font-size:16px;font-weight:600;color-scheme:dark}
.log{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.lbl{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.wrow{display:flex;gap:8px;align-items:stretch}
.numin{flex:1;display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:0 12px;min-height:54px}
.numin input{width:100%;border:none;background:none;font-size:22px;font-weight:800;outline:none;padding:0}
.numin span{font-weight:700;color:var(--mut)}
.numin:focus-within{border-color:var(--c);background:var(--surface)}
.sets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:7px}

.set:focus-within{border-color:var(--c);background:var(--surface)}
.set .sn{font-size:11.5px;font-weight:700;color:var(--mut)}
.set input{width:100%;border:none;background:none;text-align:center;font-size:26px;font-weight:800;outline:none;padding:0 0 2px}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rir button{min-height:46px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:17px}

textarea,.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
textarea{min-height:70px;resize:vertical;line-height:1.4}
textarea:focus,.field input:focus,.field select:focus{border-color:var(--c,var(--primary));background:var(--surface)}

.sugg.hold{background:var(--hold-bg);color:var(--hold-ink)}
.sugg.down{background:var(--down-bg);color:var(--down-ink)}
.sugg small{display:block;opacity:.75;font-size:12.5px;margin-top:2px}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok-ink)}
.saved b{font-size:15px}
.saved .muted{color:var(--ok-ink);opacity:.8}
.ex.is-saved::before{background:var(--ok)}
.tick{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tick svg{width:16px;height:16px}
.sticky-finish{margin-top:16px}

.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--track);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .lv{font-size:12.5px;font-weight:800}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:15px;text-align:left;width:100%;text-decoration:none}
.listrow .mid{flex:1;min-width:0}
.listrow .mid b{display:block;font-size:16px;line-height:1.25}
.listrow .mid span{display:block;font-size:13.5px;color:var(--mut);margin-top:1px}
.listrow .bar{width:5px;align-self:stretch;border-radius:5px;background:var(--c);flex-shrink:0}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface2);border-radius:13px;padding:11px 13px}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow .top b{font-size:15px}
.hrow .reps{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:.01em}
.hrow .reps small{font-size:13px;font-weight:650;color:var(--mut);margin-left:6px}
.hrow .n{font-size:13.5px;color:var(--mut);margin-top:4px}
.trend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:15px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:6px 10px}
.kv span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kv b{font-size:15.5px}

/* ============ Sheet / modal ============ */
.scrim{position:fixed;inset:0;background:rgba(30,26,34,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.scrim.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-h h3{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sheet-b{padding:4px 16px calc(var(--safe-b) + 20px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:700;color:var(--mut)}
.field .hint{font-size:12.5px;color:var(--mut)}
.checkrow{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.checkrow input{width:22px;height:22px;accent-color:var(--primary)}
.form{display:flex;flex-direction:column;gap:12px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-weight:650;font-size:14.5px;z-index:80;opacity:0;transition:all .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ============ Routine / edit ============ */
.blockchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.blockchips::-webkit-scrollbar{display:none}
.blockchips button{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px}
.blockchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.blockchips button small{font-weight:600;opacity:.7;margin-left:4px}
.editing .ex{border:1.5px dashed #8A7F8E}
.edit-tools{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.edit-tools .btn{flex:1}
.dayhead{border-radius:18px;padding:14px 16px;background:var(--c);color:#fff;margin-top:16px}
.dayhead b{font-size:21px;letter-spacing:-.01em}
.dayhead span{display:block;font-size:14.5px;opacity:.92}
.dayhead p{font-size:13.5px;opacity:.88;margin-top:6px}
.guide h4{font-size:16.5px;margin-bottom:6px}
.guide p,.guide li{font-size:15px;line-height:1.48}
.guide ul,.guide ol{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.progrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--c)}
.progrow b{font-size:17px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--c);color:#fff}
.step.later .n{background:var(--surface);color:var(--mut);border:2px dashed #B8B0BC}
.step b{display:block;font-size:15.5px;margin-top:5px}
.step span{display:block;font-size:14px;color:var(--mut)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.c,:root:not([data-theme="light"]) .ex-pos,:root:not([data-theme="light"]) .grouphead,:root:not([data-theme="light"]) .wd.gym .act,:root:not([data-theme="light"]) .pill.dash,:root:not([data-theme="light"]) .btn.soft,:root:not([data-theme="light"]) .tip svg,:root:not([data-theme="light"]) .th{color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}}
:root[data-theme="dark"] .pill.c,:root[data-theme="dark"] .ex-pos,:root[data-theme="dark"] .grouphead,:root[data-theme="dark"] .wd.gym .act,:root[data-theme="dark"] .pill.dash,:root[data-theme="dark"] .btn.soft{color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}
</style>

<script>
'use strict';
/* =====================================================================
   MI RUTINA · app personal de entrenamiento
   Archivo único. Secciones:

/* ---------- 1. Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

const WD = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* ---------- 2. Íconos ---------- */
const P = {

const Store = {
  mode:'memory', db:null, DB:'mi-rutina', OS:'kv', KEY:'state', LS:'mi-rutina-state',
  async init() {
    try {
      if (!window.indexedDB) throw new Error('sin indexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(this.DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(this.OS);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      this.mode = 'indexeddb';
    } catch (e) {
      try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
    }
  },
  async readKey(key, ls) {
    let data = null;
    if (this.mode === 'indexeddb') {
      data = await new Promise(res => { try {
        const g = this.db.transaction(this.OS, 'readonly').objectStore(this.OS).get(key);
        g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
      } catch (e) { res(null); } });
    }
    if (!data) { try { const t = localStorage.getItem(ls); if (t) data = JSON.parse(t); } catch (e) {} }
    return data;
  },
  async load() {
    let data = await this.readKey(this.KEY, this.LS);
    // Datos guardados antes de que existieran los perfiles: pertenecen a Guada
    if (!data && this.legacy) { data = await this.readKey('state', 'mi-rutina-state'); if (data) data.__migrated = true; }
    return data;
  },
  async save(obj) {
    const json = JSON.stringify(obj);
    if (this.mode === 'indexeddb') {
      await new Promise((res, rej) => {
        const tx = this.db.transaction(this.OS, 'readwrite');
        tx.objectStore(this.OS).put(JSON.parse(json), this.KEY);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    // copia espejo en localStorage (segunda red de seguridad)
    try { localStorage.setItem(this.LS, json); } catch (e) {}
  },
};
let S = null; let saveTimer = null;
function persist(now = false) {

  const w = Math.floor(daysBetween(mondayOf(b.startDate), b.endDate && b.endDate < ref ? b.endDate : ref) / 7) + 1;
  return Math.max(1, w);

function targetStr(ex) {

  const sets = ex.setsMin && ex.setsMin < ex.sets ? `${ex.setsMin}-${ex.sets}` : ex.sets;

  if (filled.length < (ex.setsMin || ex.sets)) return {lvl:'hold', icon:'pause', text:'Sesión incompleta: mantener carga y completar todas las series la próxima vez.'};

  if (filled.every(r => r >= hi)) {
    if (R.lo != null && e.rir != null && e.rir < R.lo) return {lvl:'hold', icon:'pause', text:(T ? T.hold + ' ' : '') + 'Completaste el rango, pero por debajo del RIR previsto: consolidá esta carga.'};

    else if (ex.load === 'time') inc = 'Si te resultó fácil, podés sumar algo de tiempo o agregar 5-10 kg.';
    else if (ex.bigJump && e.rir != null && e.rir >= 4) inc = 'La carga quedó claramente liviana: en este ejercicio podés probar +5-10 kg.';

function lineChart(pts, {color = 'var(--primary)', unit = '', h = 180} = {}) {

let CUR = (() => { try { return location.hash.replace(/^#\/?/, ''); } catch (e) { return ''; } })() || 'inicio';
function go(path) {
  CUR = String(path).replace(/^#?\/?/, '') || 'inicio';
  try { history.pushState(null, '', '#/' + CUR); } catch (e) { /* vista previa aislada: navegamos en memoria */ }
  closeSheet(true); route();
}
function route() {
  if (!S) return showChooser();

  const navKey = {sesion:'entrenar', running:'entrenar'}[view] || (map[view] ? view : 'inicio');

function rerender() { if (!S) return showChooser(); const y = window.scrollY; const h = CUR; const [view, arg] = h.split('/');

    <div class="topbar" style="margin-bottom:22px"><div><h1>¿Quién entrena?</h1><div class="sub">Cada perfil tiene su rutina y sus datos por separado en este dispositivo.</div></div></div>

      <span class="sw" style="width:54px;height:54px;font-size:20px">${esc(p.name[0])}</span><span class="tx"><b style="font-size:21px">${esc(p.name)}</b></span><span class="chev">${ic('right')}</span></button>`).join('')}</div>

/* --- Sábado de recuperación (perfil Priscila) --- */
function satPanel(onColor) {
  const ws = weekStatus(); const rec = recoveryThisWeek(); const missed = ws.filter(x => x.st === 'missed');
  const mon = mondayOf(todayISO()); const satMark = (S.weekMarks[mon] || {}).sat;
  const B = onColor ? 'btn' : 'btn soft';
  if (rec) {
    const blk = blockById(rec.blockId) || activeBlock(); const d = dayOf(blk, rec.recoveryOf.dayKey) || {name:'', title:''};
    const rest = missed.filter(x => x.day.key !== rec.recoveryOf.dayKey);
    return {k:'Sábado', t:rec.status === 'done' ? `Recuperaste ${d.name.toLowerCase()}` : `Recuperando ${d.name.toLowerCase()}`, d:d.title,
      body:`${rec.status !== 'done' ? `<a class="${B} block" style="margin-top:14px" href="#/sesion/${rec.id}">Continuar entrenamiento</a>` : ''}
      ${rest.length ? `<p class="small" style="margin-top:12px;opacity:.9">${rest.map(x => esc(x.day.name)).join(', ')} ${rest.length > 1 ? 'quedan registrados' : 'queda registrado'} como no realizado${rest.length > 1 ? 's' : ''}. No hace falta compensar todo el volumen.</p>` : ''}`};
  }
  if (!missed.length) {
    return {k:'Sábado', t:'Semana completada', d:satMark === 'rest' ? 'Elegiste descansar. ¡Bien ahí!' : 'Cardio opcional de 30-45 min o descanso.',
      body:`<div class="grid2" style="margin-top:14px"><button class="${B}" style="margin:0" data-act="go-running">${ic('run', 18)} Cardio</button><button class="${B}" style="margin:0" data-act="sat-rest">${ic('moon', 18)} Descanso</button></div>`};
  }
  if (missed.length === 1) {
    const x = missed[0];
    return {k:'Sábado · recuperar entrenamiento', t:`Recuperar ${x.day.name}`, d:x.day.title,
      body:`<button class="${B} block" style="margin-top:14px" data-act="recover" data-day="${x.day.key}" data-date="${x.date}">Recuperar ${esc(x.day.name.toLowerCase())} · ${esc(x.day.title)}</button>
      <p class="small" style="margin-top:10px;opacity:.85">Se repite exactamente la sesión, con fecha de hoy. El cardio del sábado queda para cuando no haya pendientes.</p>`};
  }
  return {k:'Sábado · recuperar entrenamiento', t:'Elegí qué entrenamiento recuperar', d:`Tenés ${missed.length} pendientes: recuperá solo uno.`,
    body:`<div class="stack" style="margin-top:14px">${missed.map(x => `<button class="${B} block" style="margin:0;justify-content:flex-start" data-act="recover" data-day="${x.day.key}" data-date="${x.date}">${esc(x.day.name)} · ${esc(x.day.title)}</button>`).join('')}</div>
    <p class="small" style="margin-top:10px;opacity:.85">Los demás quedan registrados como no realizados. No se suman dos rutinas el mismo día.</p>`};
}
function satHero() { const p = satPanel(true); return `<div class="hero" style="--c:var(--primary)"><div class="k">${esc(p.k)}</div><div class="t">${esc(p.t)}</div><div class="d">${esc(p.d)}</div>${p.body}</div>`; }
function satCard() { const p = satPanel(false); return `<div class="card" style="--c:var(--primary)"><div class="small muted" style="font-weight:700">${esc(p.k)}</div><b style="font-size:19px;display:block;margin-top:2px">${esc(p.t)}</b><div class="muted" style="font-size:14.5px">${esc(p.d)}</div>${p.body}</div>`; }
function showSatSheet() { const p = satPanel(false); openSheet(p.t, `<p class="muted" style="margin-bottom:4px">${esc(p.d)}</p>${p.body}`); }

function showDayStatus(key) {
  const x = weekStatus().find(w => w.day.key === key); if (!x) return;
  const d = x.day;
  const stColor = {done:'var(--ok)', recovered:'var(--ok)', missed:'var(--down)', pending:'var(--mut)'}[x.st];
  openSheet(`${d.name} · ${d.title}`, `<p style="font-size:15.5px"><span class="pill c" style="--c:${stColor}">${ST_LABEL[x.st]}</span>${x.auto ? ' <span class="small muted">· sin registrar</span>' : ''}</p>
    <p class="small muted" style="margin-top:8px">${fmtLong(x.date)}${x.rec ? ` · recuperado el ${fmtDate(x.rec.date)}` : ''}</p>
    <div class="stack" style="margin-top:16px">
      ${x.sess ? `<button class="btn block ghost" data-act="session-view" data-id="${x.sess.id}">${ic('hist', 18)} Ver sesión registrada</button>` : ''}
      ${x.st !== 'done' ? `<button class="btn block" style="background:${d.color}" data-act="start" data-day="${d.key}">Entrenar ${esc(d.name.toLowerCase())} ahora</button>` : ''}
      ${!x.sess && x.mark !== 'done' ? `<button class="btn block soft" style="--c:var(--ok)" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="done">${ic('check', 18)} Marcar como realizado</button>` : ''}
      ${!x.sess && x.mark !== 'missed' && x.st !== 'recovered' ? `<button class="btn block danger" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="missed">${ic('x', 18)} Marcar como no realizado</button>` : ''}
      ${x.mark ? `<button class="linkbtn" style="align-self:center" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="">Quitar marca</button>` : ''}
    </div>
    <p class="small muted" style="margin-top:12px">“Marcar como realizado” sirve si entrenaste pero no cargaste los datos. Los días pasados sin registro cuentan como no realizados.</p>`);
}

/* Cardio posterior a la sesión (martes y jueves en el perfil de Priscila) */

  if (!PROFILE.cardioAfter[s.dayKey]) return '';
  const c = s.cardio || {}; const col = DAY_COLORS.run;
  return `<div class="section-title">Cardio <small>después de la sesión</small></div>
  <div class="ex" style="--c:${col}"><div class="ex-in">
    <div class="ex-h"><div><div class="ex-n">20-30 min moderado</div></div>${c.minutes ? `<span class="tick">${ic('check')}</span>` : ''}</div>
    <div class="tip">${ic('info', 17)}<div>${esc(PROFILE.cardioAfterText)}</div></div>
    <div class="grid2" style="margin-top:12px">
      <div><div class="lbl"><span>Minutos</span></div><label class="numin"><input inputmode="numeric" data-cfield="minutes" value="${c.minutes ?? ''}" placeholder="0" aria-label="Minutos de cardio"><span>min</span></label></div>
      <div class="field"><div class="lbl"><span>Actividad</span></div><select data-cfield="activity" style="min-height:54px">${['', ...PROFILE.activities].map(a => `<option value="${esc(a)}" ${c.activity === a ? 'selected' : ''}>${a ? esc(a) : 'Elegir…'}</option>`).join('')}</select></div>
    </div>
    <div class="lbl" style="margin-top:12px"><span>Notas</span></div>

function warmupBlock() {
  if (!PROFILE.warmup) return '';
  return `<details class="acc card" open style="margin:0 0 10px;padding:4px 16px 12px;border-top:1px solid var(--line)"><summary><span class="sl">${ic('clock', 18)} Calentamiento general</span><span class="chev">${ic('chev', 18)}</span></summary>
    <div class="acc-body"><ul>${PROFILE.warmup.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></details>`;
}
const recLabel = s => s && s.recoveryOf ? `Recuperación del ${(dayOf(blockById(s.blockId) || activeBlock(), s.recoveryOf.dayKey) || {name:''}).name.toLowerCase()}` : '';

function guideHTMLPriscila() {
  return `<div class="stack guide" style="margin-top:12px">
  <div class="card"><h4>Qué significa RIR</h4><p>${PROFILE.rirText}</p></div>
  <div class="card"><h4>Pesos iniciales</h4><p>Todos los pesos indicados son <b>orientativos</b>. No tenés que usar necesariamente ese número: durante las primeras sesiones se calibra la carga con técnica, rango de movimiento, repeticiones y RIR.</p></div>
  <div class="banner warn">${ic('gear')}<div><b>Máquinas.</b> Especialmente en máquinas, los kilos no son comparables entre gimnasios: el mismo número puede sentirse muy distinto.</div></div>
  <div class="card"><h4>Progresión</h4><p>Se mantienen los mismos ejercicios durante unas 6 semanas. No se cambian semanalmente: progresan las cargas, las repeticiones y la ejecución.</p>
    <p class="muted" style="margin:8px 0">Ejemplo con 3 × 8-10:</p><div class="stack">
    <div class="progrow" style="--c:var(--ok)"><b>10 / 10 / 10</b><span>Con buena técnica y el RIR previsto → podés aumentar ligeramente la carga en la próxima sesión.</span></div>

    <p style="margin-top:8px">La app nunca modifica los pesos automáticamente: solo sugiere.</p></div>
  <div class="card"><h4>Calentamiento general</h4><ul>${PROFILE.warmup.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>

/* ---------- Cómo se hace cada ejercicio ----------
   Se busca por nombre, así funciona también con ejercicios editados o nuevos.
   Si un ejercicio tiene pasos propios (campo howto), se usan esos. */
const HOWTO = {
  hipthrust:{w:'Glúteos (principal) e isquiotibiales.', s:['Sentate en el piso con la parte alta de la espalda (justo debajo de los omóplatos) apoyada en el borde de un banco.','Apoyá la barra sobre la cadera con una almohadilla. Pies apoyados al ancho de los hombros y rodillas flexionadas.','Empujá con los talones y subí la cadera hasta que el torso quede paralelo al piso y las rodillas formen un ángulo recto.','Arriba, apretá los glúteos un segundo con el mentón levemente hacia el pecho.','Bajá controlado, sin apoyar del todo la cola en el piso. Si hay máquina de hip thrust, la idea es la misma.'], q:'hip thrust con barra técnica'},
  hack:{w:'Cuádriceps y glúteos.', s:['Es una máquina con respaldo inclinado y almohadillas para los hombros.','Apoyá la espalda y la cadera en el respaldo, con los hombros debajo de las almohadillas.','Pies en la plataforma al ancho de la cadera. Destrabá los seguros.','Bajá flexionando las rodillas hasta donde puedas mantener la espalda apoyada (idealmente muslos paralelos a la plataforma o más).','Subí empujando con todo el pie, sin trabar las rodillas arriba. Si no hay hack, la alternativa es la sentadilla con barra sobre los trapecios.'], q:'hack squat máquina técnica'},
  bulgara:{w:'Glúteos y cuádriceps.', s:['Parate de espaldas a un banco y apoyá el empeine de un pie atrás, sobre el banco.','Adelantá el otro pie: un paso largo carga más el glúteo; uno corto, más el cuádriceps.','Con una mancuerna en cada mano, inclinate apenas hacia adelante.','Bajá flexionando la rodilla de adelante hasta que el muslo quede casi paralelo al piso. La rodilla de atrás va hacia el piso.','Subí empujando con el talón de la pierna de adelante. Hacé todas las repeticiones y recién ahí cambiá de pierna.'], q:'sentadilla búlgara glúteo técnica'},
  bulgara_smith:{w:'Glúteos y cuádriceps.', s:['Poné un banco detrás de la máquina Smith y apoyá la barra sobre los trapecios.','Apoyá el empeine de un pie atrás, sobre el banco, y adelantá el otro pie.','Destrabá la barra y bajá flexionando la rodilla de adelante, en línea recta, hasta que el muslo quede casi paralelo al piso.','Subí empujando con la pierna de adelante, sin apoyarte en la de atrás.','Hacé todas las repeticiones con una pierna y después cambiá.'], q:'sentadilla búlgara en smith técnica'},
  prensa:{w:'Cuádriceps y glúteos.', s:['Sentate con la espalda y la cola bien apoyadas en el respaldo.','Pies en el centro de la plataforma, al ancho de los hombros.','Destrabá los seguros y bajá la plataforma flexionando las rodillas hasta unos 90°, o hasta donde puedas sin despegar la cola.','Empujá con todo el pie para subir, sin trabar las rodillas arriba.'], q:'prensa de piernas técnica'},
  prensa_altos:{w:'Glúteos e isquiotibiales (más que la prensa común).', s:['Sentate con la espalda y la cola bien apoyadas.','Apoyá los pies más arriba en la plataforma que en la prensa común, al ancho de los hombros.','Destrabá y bajá flexionando rodillas y cadera, sin que la cola se despegue del respaldo.','Empujá con los talones para subir, sin trabar las rodillas.'], q:'prensa pies altos glúteos técnica'},
  gemelos_prensa:{w:'Pantorrillas (gemelos).', s:['Sentate en la prensa y apoyá solo la parte delantera de los pies (debajo de los dedos) en el borde inferior de la plataforma, con los talones afuera.','Extendé las piernas sin trabar las rodillas.','Empujá con las puntas de los pies, estirando los tobillos al máximo.','Volvé dejando que los talones bajen bien para estirar. Cuidá que los pies no se resbalen.'], q:'gemelos en prensa técnica'},
  ext_cuad:{w:'Cuádriceps (frente del muslo).', s:['Sentate con la espalda apoyada y la rodilla alineada con el eje de giro de la máquina.','El rodillo va sobre la parte baja de la canilla, arriba del tobillo.','Estirá las piernas hasta casi extenderlas del todo y apretá un segundo.','Bajá lento.'], q:'extensión de cuádriceps máquina técnica'},
  curl_fem:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Según la máquina, se hace acostada boca abajo o sentada.','Las rodillas quedan alineadas con el eje de giro y el rodillo, sobre la parte de atrás de los tobillos.','Flexioná las rodillas llevando los talones hacia la cola, sin levantar la cadera.','Volvé lento hasta casi estirar.'], q:'curl femoral máquina técnica'},
  curl_fem_acostada:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Acostate boca abajo en la máquina, con las rodillas justo pasando el borde del banco.','El rodillo va sobre la parte de atrás de los tobillos. Agarrate de las manijas.','Flexioná las rodillas llevando los talones hacia la cola, sin despegar la cadera del banco.','Volvé lento hasta casi estirar.'], q:'curl femoral acostado técnica'},
  curl_fem_sentada:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Sentate con la espalda apoyada, la rodilla alineada con el eje y el rodillo de arriba trabando el muslo.','Apoyá la parte de atrás del tobillo de una pierna sobre el rodillo de abajo.','Flexioná la rodilla llevando el talón hacia abajo y atrás.','Volvé lento. Hacé todas las repeticiones y cambiá de pierna.'], q:'curl femoral sentado unilateral técnica'},
  abduccion:{w:'Glúteo medio (costado de la cola). Abducción = alejar la pierna del centro del cuerpo.', s:['En la máquina: sentate con la espalda apoyada y las almohadillas del lado de afuera de las rodillas.','Abrí las piernas hacia los costados empujando con la parte externa de las rodillas.','Pausá un segundo con las piernas abiertas.','Cerrá lento, sin que las placas choquen.','En polea: tobillera en la polea baja, parada de costado, y llevás la pierna más lejana hacia afuera.'], q:'abducción de cadera máquina técnica'},
  aduccion:{w:'Aductores (parte interna del muslo). Aducción = acercar la pierna al centro del cuerpo.', s:['Sentate con la espalda apoyada y las almohadillas del lado de adentro de las rodillas.','Arrancás con las piernas abiertas.','Cerrá las piernas apretando hacia el centro.','Abrí lento hasta la posición inicial.'], q:'aducción de cadera máquina técnica'},
  elev_piernas:{w:'Abdomen, sobre todo la parte baja.', s:['En silla romana: antebrazos apoyados, espalda contra el respaldo y el cuerpo colgando.','Subí las piernas (rectas o apenas flexionadas) hasta unos 90°.','Al subir, enrollá la pelvis hacia adelante: la cola se despega un poco del respaldo.','Bajá controlado, sin balancearte.','En paralelas es igual, pero sosteniéndote con los brazos extendidos.'], q:'elevación de piernas silla romana técnica'},
  elev_rodillas:{w:'Abdomen.', s:['Colgada de una barra, o en silla romana con los antebrazos apoyados.','Llevá las rodillas flexionadas hacia el pecho.','Arriba, enrollá la pelvis hacia adelante.','Bajá controlado, sin balancearte.'], q:'elevación de rodillas colgado técnica'},
  situp:{w:'Abdomen.', s:['Sentate en el banco declinado con los pies trabados debajo de los rodillos.','Sostené un disco contra el pecho con los brazos cruzados.','Bajá controlado hasta casi apoyar la espalda.','Subí enrollando el tronco hasta quedar sentada. No tironees del cuello.'], q:'sit up banco declinado con peso técnica'},
  jalon:{w:'Dorsales (espalda) y bíceps.', s:['Sentate con los muslos trabados debajo de los rodillos.','Agarrá la barra o las manijas con los brazos estirados. En agarre neutro, las palmas se miran entre sí.','Sacá pecho e inclinate apenas hacia atrás.','Tirá llevando los codos hacia abajo y atrás hasta que las manos lleguen a la parte alta del pecho.','Subí lento, estirando los brazos.'], q:'jalón al pecho agarre neutro técnica'},
  remo_sentado:{w:'Espalda media y dorsales.', s:['Sentate con el pecho apoyado en el respaldo, o con los pies en la plataforma si es en polea.','Agarrá las manijas con los brazos estirados y la espalda recta.','Tirá llevando los codos hacia atrás, pegados al cuerpo, y juntá los omóplatos.','Volvé lento estirando los brazos, sin encorvarte.'], q:'remo sentado polea técnica'},
  remo_barra:{w:'Espalda media y dorsales.', s:['Con barra: inclinate desde la cadera a unos 45°, espalda recta y rodillas apenas flexionadas.','Dejá la barra colgando con los brazos estirados.','Tirá la barra hacia el ombligo llevando los codos hacia atrás.','Bajá lento. Si es en polea, se hace como el remo sentado.'], q:'remo con barra técnica'},
  remo_brazo:{w:'Dorsales y espalda media.', s:['Apoyá una mano y la rodilla del mismo lado en un banco, con la espalda paralela al piso.','Con la otra mano sostené la mancuerna, con el brazo estirado.','Tirá llevando el codo hacia atrás y arriba, en dirección a la cadera.','Bajá estirando el brazo, sin girar el torso.'], q:'remo a un brazo con mancuerna técnica'},
  remo_inv:{w:'Espalda y bíceps. Es la base para llegar a la dominada.', s:['Poné la barra de la Smith más o menos a la altura de la cintura, o usá un TRX.','Agarrate y caminá con los pies hacia adelante hasta quedar inclinada, con el cuerpo recto de la cabeza a los talones.','Tirá llevando el pecho hacia la barra y juntando los omóplatos.','Bajá lento. Cuanto más vertical estés, más fácil; cuanto más horizontal, más difícil.'], q:'remo invertido smith técnica'},
  pullover:{w:'Dorsales.', s:['Parate frente a la polea alta con una barra recta o una cuerda y da un paso atrás.','Inclinate apenas hacia adelante, con los brazos casi extendidos arriba.','Bajá la barra en arco hasta los muslos, sin flexionar los codos: el movimiento sale del hombro.','Volvé en arco, lento.'], q:'pullover en polea brazos extendidos técnica'},
  press_pecho:{w:'Pectorales, tríceps y la parte de adelante del hombro.', s:['Acostate en el banco plano con los pies firmes en el piso y los omóplatos juntos.','Sostené las mancuernas o la barra a la altura del pecho, con los codos a unos 45° del cuerpo.','Empujá hacia arriba sin trabar los codos.','Bajá controlado hasta el pecho. En máquina: sentada, con las manijas a la altura del pecho.'], q:'press de pecho con mancuernas técnica'},

function howtoFor(ex) {
  if (ex.howto && ex.howto.length) return {w:'', s:ex.howto, q:ex.name + ' técnica'};
  const n = normName(ex.name);
  const m = HOWTO_MATCH.find(([re]) => re.test(n));
  return m ? HOWTO[m[1]] : null;
}
function howtoBlock(ex) {

/* --- Sesión (modo entrenamiento) --- */

  const exs = day.exercises; const savedN = exs.filter(e => s.entries[e.id]?.saved).length;

  <a class="back" href="#/entrenar">${ic('left', 18)} Entrenar</a>
  <div class="sess-head" style="--c:${day.color}">

    <div class="bar"><i style="width:${exs.length ? savedN / exs.length * 100 : 0}%"></i></div>
  </div>
  ${s.status === 'done' ? `<div class="banner info" style="margin-bottom:10px">${ic('info')}<div>Sesión finalizada el ${fmtDate(s.date)}. Podés corregir datos; se guardan al tocar “Guardar ejercicio”.</div></div>` : ''}
  ${day.intro ? `<div class="banner info" style="--c:${day.color};margin-bottom:10px">${ic('info')}<div>${esc(day.intro)}</div></div>` : ''}
  ${warmupBlock()}
  <div style="text-align:right;margin:-2px 0 6px"><button class="linkbtn" data-act="rir-info">${ic('info', 16)} ¿Qué es el RIR?</button></div>
  <div class="stack">${g.main.map(ex => card(ex, ++idx)).join('')}</div>
  ${g.core.length ? `<div class="grouphead" style="--c:${day.color}">Abdomen / core</div><div class="stack" style="margin-top:8px">${g.core.map(ex => card(ex, 'A' + (g.core.indexOf(ex) + 1))).join('')}</div>` : ''}
  ${cardioBlock(s)}

  </div>
  <div style="margin-top:12px;text-align:center"><button class="linkbtn" style="color:var(--down)" data-act="discard" data-id="${s.id}">Descartar sesión</button></div>
  `;
}
function sessionCard(s, ex, pos, color) {

  const sug = suggest(ex, last);
  const firstTip = ex.tech[0] || ex.note || '';

    <button class="iconbtn" data-act="history" data-ex="${ex.id}" aria-label="Ver historial">${ic('hist')}</button></div>${exTags(ex)}`;

  if (e.saved) {

    return `<div class="ex is-saved" style="--c:${color}" id="ex-${ex.id}"><div class="ex-in">${head}
      <div class="saved"><div><b>${esc(entryLine(e))}</b>${e.notes ? `<div class="small muted">${esc(e.notes)}</div>` : ''}</div><span class="tick">${ic('check')}</span></div>
      ${nextSug ? `<div class="sugg ${nextSug.lvl}">${ic(nextSug.icon, 19)}<div><b>Para la próxima:</b> ${esc(nextSug.text)}${nextSug.extra ? `<small>${esc(nextSug.extra)}</small>` : ''}<small>Sugerencia: el peso no se modifica automáticamente.</small></div></div>` : ''}

    ${ex.warn[0] ? `<div class="warnline">${ic('warn', 17)}<div>${esc(ex.warn[0])}${ex.warn.length > 1 ? ' <i>(+ ver indicaciones)</i>' : ''}</div></div>` : ''}

/* --- Running --- */

/* --- Progreso --- */
function vProgress() {
  const blocks = S.blocks;
  const filter = UI.progBlock;
  const inBlock = s => filter === 'all' || s.blockId === filter;
  let body = '';
  if (UI.progTab === 'ejercicios') {
    const map = new Map();
    S.sessions.filter(inBlock).forEach(s => Object.values(s.entries).forEach(e => {
      if (!e.saved) return; const k = e.exId; if (!map.has(k)) map.set(k, {exId:k, name:e.name, items:[], dayKey:s.dayKey});
      map.get(k).items.push({...e, date:s.date});
    }));
    const groups = [...map.values()].map(g => (g.items.sort((a, b) => a.date.localeCompare(b.date)), g));
    const order = activeBlock().days.flatMap(d => d.exercises.map(e => e.id));
    groups.sort((a, b) => ((order.indexOf(a.exId) + 1) || 999) - ((order.indexOf(b.exId) + 1) || 999));
    body = groups.length ? `<div class="stack">${groups.map(g => {
      const last = g.items[g.items.length - 1]; const color = DAY_COLORS[g.dayKey] || '#888';
      return `<button class="listrow" style="--c:${color}" data-act="history" data-ex="${g.exId}"><span class="bar"></span><span class="mid"><b>${esc(g.name)}</b><span>${esc(entryLine(last))} · ${fmtDate(last.date)}</span></span>${sparkline(g.items.map(i => i.weight), color)}</button>`;
    }).join('')}</div>` : `<div class="empty"><b>Todavía no hay ejercicios registrados</b>Guardá ejercicios en un entrenamiento y vas a ver su evolución acá.</div>`;
  } else {
    const ss = sessionsSorted().filter(s => s.status === 'done' && inBlock(s));
    const rs = S.runs.filter(r => filter === 'all' || r.blockId === filter);
    const total = ss.length + rs.length;
    body = `<div class="grid3" style="margin-bottom:12px"><div class="metric"><div class="l">Gimnasio</div><div class="v">${ss.length}</div></div><div class="metric"><div class="l">Running</div><div class="v">${rs.length}</div></div><div class="metric"><div class="l">Total</div><div class="v">${total}</div></div></div>`;
    body += total ? recentListFiltered(ss, rs) : `<div class="empty"><b>Sin sesiones</b>Finalizá un entrenamiento para verlo acá.</div>`;
  }
  return `<div class="topbar"><div><h1>Progreso</h1><div class="sub">Historial por ejercicio y sesiones</div></div></div>
  <div class="seg" role="tablist"><button class="${UI.progTab === 'ejercicios' ? 'on' : ''}" data-act="prog-tab" data-v="ejercicios">Ejercicios</button><button class="${UI.progTab === 'sesiones' ? 'on' : ''}" data-act="prog-tab" data-v="sesiones">Sesiones</button></div>
  <div class="blockchips" style="margin:12px 0">${[['all', 'Todos los bloques']].concat(blocks.map(b => [b.id, b.name])).map(([id, n]) => `<button class="${filter === id ? 'on' : ''}" data-act="prog-block" data-v="${id}">${esc(n)}</button>`).join('')}</div>
  ${body}`;
}
function recentListFiltered(ss, rs) {

  return `<div class="stack">${items.map(it => {
    if (it.t === 'r') return `<button class="listrow" style="--c:${DAY_COLORS.run}" data-act="run-edit" data-id="${it.r.id}"><span class="bar"></span><span class="mid"><b>${esc(it.r.activity || PROFILE.cardioLabel)}</b><span>${fmtDate(it.r.date)}${it.r.duration ? ' · ' + it.r.duration + ' min' : ''}${it.r.distance ? ' · ' + fmtN(it.r.distance) + ' km' : ''}</span></span>${ic('right')}</button>`;

    return `<button class="listrow" style="--c:${day.color}" data-act="session-view" data-id="${it.s.id}"><span class="bar"></span><span class="mid"><b>${esc(day.name)}${it.s.recoveryOf ? ' <span class="small muted">· recuperación</span>' : ''}</b><span>${fmtDate(it.s.date)} · ${Object.values(it.s.entries).filter(e => e.saved).length} ejercicios · ${esc(blk.name)}</span></span>${ic('right')}</button>`;
  }).join('')}</div>`;
}
function showHistory(exId) {
  const ex = findExercise(exId);
  const name = ex?.name || entriesFor(e => e.exId === exId)[0]?.name || 'Ejercicio';
  const list = entriesFor(e => e.exId === exId);
  const others = ex ? entriesFor(e => e.exId !== exId && normName(e.name) === normName(name)) : [];
  const color = ex ? (DAY_COLORS[dayKeyOfExercise(exId)] || 'var(--primary)') : 'var(--primary)';
  const withW = list.filter(e => e.weight != null);
  const first = withW[0], last = withW[withW.length - 1];
  let trend = '';
  if (first && last && withW.length > 1) { const d = last.weight - first.weight; trend = `<div class="trend"><span class="pill">Primera: ${fmtN(first.weight)} kg</span><span class="pill">Última: ${fmtN(last.weight)} kg</span><span class="pill c" style="--c:${d >= 0 ? 'var(--ok)' : 'var(--down)'}">${d >= 0 ? '+' : ''}${fmtN(d)} kg</span></div>`; }
  const sumReps = e => (e.reps || []).reduce((a, r) => a + (num(r) || 0), 0);
  list.forEach((e, i) => { e.__prev = list[i - 1] || null; });
  const cmp = e => { const p = e.__prev; if (!p) return ''; const parts = [];
    if (e.weight != null && p.weight != null) { const dw = e.weight - p.weight; parts.push(Math.abs(dw) < .01 ? 'mismo peso' : `${dw > 0 ? '+' : ''}${fmtN(dw)} kg`); }
    const dr = sumReps(e) - sumReps(p); parts.push(dr === 0 ? 'mismas reps totales' : `${dr > 0 ? '+' : ''}${dr} reps totales`);
    const up = (e.weight ?? 0) > (p.weight ?? 0) || ((e.weight ?? 0) === (p.weight ?? 0) && dr > 0);
    return `<div class="n" style="color:${up ? 'var(--ok)' : 'var(--mut)'};font-weight:650">vs. anterior: ${parts.join(' · ')}</div>`; };
  const row = e => { const blk = blockById(e.blockId); const day = blk ? dayOf(blk, e.dayKey) : null;
    return `<div class="hrow"><div class="top"><b>${fmtDate(e.date)}</b><span class="small muted">${esc(day?.name || '')}${e.recoveryOf ? ' · recuperación' : ''}${blk ? ' · ' + esc(blk.name) : ''}</span></div>
      <div class="reps">${e.weight != null ? fmtN(e.weight) + ' kg' : 'Sin carga'}<small>${esc(entryReps(e))}${e.rir != null ? ' · RIR ' + rirTxt(e.rir) : ''}</small></div>${cmp(e)}${e.notes ? `<div class="n">${esc(e.notes)}</div>` : ''}</div>`; };
  const body = `${ex ? `<p class="small muted" style="margin-bottom:8px">Objetivo actual: ${esc(targetStr(ex))}${rirInfo(ex).label ? ' · RIR ' + esc(rirInfo(ex).label) : ''}</p>` : ''}
    <div class="card" style="padding:10px 8px 6px">${lineChart(list.map(e => ({x:e.date, y:e.weight})), {color, unit:'kg'})}</div>
    ${trend}
    ${list.length ? `<div class="hist" style="margin-top:10px">${[...list].reverse().map(row).join('')}</div>` : `<div class="empty" style="margin-top:10px"><b>Sin registros</b>Guardá este ejercicio en un entrenamiento.</div>`}
    ${others.length ? `<div class="section-title" style="font-size:16px">Mismo ejercicio en otro día</div><div class="hist">${[...others].reverse().slice(0, 8).map(row).join('')}</div>` : ''}`;
  openSheet(name, body);
}
function findExercise(exId) { for (const b of [activeBlock(), ...S.blocks]) for (const d of b.days) { const e = d.exercises.find(x => x.id === exId); if (e) return e; } return null; }

/* ---------- Importación de antropometrías desde PDF ----------
   1) pdf.js (cargado solo cuando se usa) extrae el texto y renderiza las páginas.
   2) Si la app corre dentro de Claude, Claude lee el informe (texto + imágenes).
      Fuera de Claude se usa un lector automático por reglas.
   3) Siempre se muestran los valores para revisar antes de guardar. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
function loadScript(src) { return new Promise((res, rej) => { const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(t); }); }
async function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;
  if (!window.pdfjsLib) await loadScript(PDFJS + '/pdf.min.js');
  // El worker se carga en el hilo principal: evita depender de Web Workers externos
  if (!window.pdfjsWorker) await loadScript(PDFJS + '/pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + '/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function readPdf(file, {maxImages = 0} = {}) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const pages = Math.min(pdf.numPages, 6); const textLines = []; const images = [];
  for (let p = 1; p <= pages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x:it.transform[4], s:it.str}); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => textLines.push(items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join('   ')));
    if (images.length < maxImages) {
      const vp0 = page.getViewport({scale:1}); const scale = Math.min(2.2, 1400 / vp0.width); const vp = page.getViewport({scale});
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      images.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86)));
    }
  }
  return {text:textLines.join('\n'), images, numPages:pdf.numPages};
}
async function getSample() {
  if (!window.claude || typeof window.claude.use !== 'function') return null;
  try { return await window.claude.use('sample'); } catch (e) { return null; }
}
const ANTHRO_PROMPT = text => `Sos un asistente que transcribe informes antropométricos de nutricionistas (formato ISAK, fraccionamiento en 5 componentes de Kerr, bioimpedancia u otros).
Extraé SOLO valores que figuren explícitamente en el informe. No calcules, no estimes, no completes. Si un dato no está, usá null.
Números con punto decimal (ej. 41.28). Fecha en formato YYYY-MM-DD (fecha de la medición, no de nacimiento).

Respondé SOLO con un objeto JSON con esta forma exacta:
{"date": "YYYY-MM-DD" o null,
 "weight": kg o null,
 "muscleKg": kg o null, "musclePct": porcentaje o null,
 "fatKg": kg o null, "fatPct": porcentaje o null,
 "waist": cm o null (cintura; la mínima si hay varias),
 "hip": cm o null (cadera; la máxima),
 "thigh": cm o null (muslo; el medial si hay varios, y aclaralo en extras si es otro),
 "arm": cm o null (brazo relajado),
 "extras": [{"label": "Masa ósea", "value": "9.1", "unit": "kg"}],
 "notes": "aclaraciones breves sobre ambigüedades, o cadena vacía"}

En "extras" incluí, si aparecen: masa ósea, masa residual, masa de piel (kg y %), sumatoria de pliegues (mm), IMC, brazo contraído, pantorrilla, tórax, otros perímetros o pliegues relevantes. Máximo 16 extras. "Masa adiposa" y "masa grasa" son lo mismo.

Texto extraído del PDF (las columnas pueden venir desordenadas; si hay imágenes de las páginas, usalas para verificar):
<<<
${text.slice(0, 60000)}
>>>`;

/* Lector por reglas (sin IA): busca etiquetas típicas y los números de la misma fila */
function parseAnthropometryText(text) {
  const L = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const nums = l => [...l.matchAll(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(kg|%|cm|mm)?(?![\d\/])/gi)].map(m => ({v:parseFloat(m[1].replace(',', '.')), u:(m[2] || '').toLowerCase()}));
  let order = ['kg', '%']; // orden de columnas si un encabezado lo indica
  const head = L.find(l => /\bkg\b/i.test(l) && /%/.test(l) && !/\d/.test(l.replace(/\d+\s*componentes/i, '')));
  if (head && head.indexOf('%') < head.toLowerCase().indexOf('kg')) order = ['%', 'kg'];
  const out = {extras:[]}; const found = (k, v) => { if (out[k] == null && v != null) out[k] = v; };
  const fmt = v => String(v).replace('.', ',');
  const pair = (line, kgRange) => {
    const ns = nums(line.replace(/^[^\d]*?(masa|peso|grasa)[^\d]*/i, ''));
    let kg = ns.find(n => n.u === 'kg')?.v ?? null, pct = ns.find(n => n.u === '%')?.v ?? null;
    const bare = ns.filter(n => !n.u).map(n => n.v);
    if (kg == null && pct == null && bare.length >= 2) { [kg, pct] = order[0] === 'kg' ? [bare[0], bare[1]] : [bare[1], bare[0]]; }
    else if (kg == null && bare.length) kg = bare[0];
    else if (pct == null && bare.length && kg != null) pct = bare[0];
    if (kg != null && (kg < kgRange[0] || kg > kgRange[1])) kg = null;
    if (pct != null && (pct <= 0 || pct >= 100)) pct = null;
    return {kg, pct};
  };
  const cm = (line, lo, hi) => { const n = nums(line).find(x => (x.u === 'cm' || !x.u) && x.v >= lo && x.v <= hi); return n ? n.v : null; };
  for (const l of L) {
    const n = normName(l);
    if (/^(peso|peso corporal|peso actual|masa corporal)\b/.test(n) && !/ideal|oseo|graso|magro|residual|objetivo|meta|perdid/.test(n)) { const x = nums(l).find(v => v.v >= 30 && v.v <= 250); found('weight', x ? x.v : null); }
    else if (/masa (muscular|musculo esqueletica)/.test(n)) { const p = pair(l, [10, 120]); found('muscleKg', p.kg); found('musclePct', p.pct); }
    else if (/masa (adiposa|grasa)|grasa corporal/.test(n)) { const p = pair(l, [3, 150]); found('fatKg', p.kg); found('fatPct', p.pct); }
    else if (/masa osea/.test(n)) { const p = pair(l, [1, 30]); if (p.kg != null) out.extras.push({label:'Masa ósea', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa residual/.test(n)) { const p = pair(l, [1, 40]); if (p.kg != null) out.extras.push({label:'Masa residual', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa (de )?piel/.test(n)) { const p = pair(l, [0.5, 15]); if (p.kg != null) out.extras.push({label:'Masa de piel', value:fmt(p.kg), unit:'kg'}); }
    else if (/^cintura/.test(n)) found('waist', cm(l, 40, 220));
    else if (/^cadera/.test(n)) found('hip', cm(l, 50, 220));
    else if (/^muslo/.test(n)) found('thigh', cm(l, 25, 120));
    else if (/^brazo/.test(n) && !/contraid|flexionad/.test(n)) found('arm', cm(l, 15, 70));
    else if (/^brazo/.test(n)) { const v = cm(l, 15, 70); if (v != null) out.extras.push({label:'Brazo contraído', value:fmt(v), unit:'cm'}); }
    else if (/^pantorrilla/.test(n)) { const v = cm(l, 20, 80); if (v != null) out.extras.push({label:'Pantorrilla', value:fmt(v), unit:'cm'}); }
    else if (/sumatoria|suma de (6|seis|8|ocho) pliegues/.test(n)) { const x = nums(l).filter(v => v.v >= 20 && v.v <= 400).pop(); if (x) out.extras.push({label:'Sumatoria de pliegues', value:fmt(x.v), unit:'mm'}); }
    else if (/^imc\b|indice de masa corporal/.test(n)) { const x = nums(l).find(v => v.v >= 12 && v.v <= 70); if (x) out.extras.push({label:'IMC', value:fmt(x.v), unit:''}); }
  }
  const dm = text.match(/fecha[^0-9]{0,25}(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/i) || text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2})\b/);
  if (dm) { let y = +dm[3]; if (y < 100) y += 2000; const d = +dm[1], m = +dm[2]; if (m >= 1 && m <= 12 && d >= 1 && d <= 31) out.date = `${y}-${pad(m)}-${pad(d)}`; }
  return out;
}
function cleanAnthro(v) {
  const o = {date:/^\d{4}-\d{2}-\d{2}$/.test(v?.date || '') ? v.date : null, extras:[]};
  ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'].forEach(k => o[k] = num(v?.[k]));
  o.extras = (Array.isArray(v?.extras) ? v.extras : []).slice(0, 16).map(x => ({label:String(x?.label || '').trim(), value:String(x?.value ?? '').replace('.', ',').trim(), unit:String(x?.unit || '').trim()})).filter(x => x.label && x.value);
  o.notes = typeof v?.notes === 'string' ? v.notes.trim() : '';
  return o;
}
async function importAnthropometryPdf(file) {
  let cancelled = false;
  const sc = openSheet('Importar antropometría', `<div class="stack"><div class="banner info">${ic('clock')}<div id="pdfstatus">Leyendo el PDF…</div></div><button class="btn block ghost" id="pdfcancel">Cancelar</button></div>`);
  const status = t => { const el = $('#pdfstatus'); if (el) el.textContent = t; };
  $('#pdfcancel', sc).onclick = () => { cancelled = true; closeSheet(); };
  try {
    const sample = await getSample();
    const caps = sample ? await sample.limits().catch(() => null) : null;
    const maxImages = caps?.images ? Math.min(caps.images.maxCount || 3, 3) : 0;
    const {text, images} = await readPdf(file, {maxImages});
    if (cancelled) return;
    let vals = null, method = '';
    if (sample && (text.trim().length > 40 || images.length)) {
      status('Claude está leyendo el informe… puede tardar hasta un minuto.');
      try { vals = cleanAnthro(await sample.json(ANTHRO_PROMPT(text || '(sin texto: es un PDF escaneado, usá las imágenes)'), images.length ? {images} : {})); method = 'ia'; }
      catch (e) { if (cancelled) return; vals = null; }
    }
    if (!vals) {
      if (text.trim().length < 40) { closeSheet(true); toast('El PDF parece escaneado y no se pudo leer automáticamente. Cargá los valores a mano.'); openSheet('Nueva medición', measForm()); return; }
      vals = cleanAnthro(parseAnthropometryText(text)); method = 'reglas';
    }
    if (cancelled) return;
    const keys = ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'];
    const nFound = keys.filter(k => vals[k] != null).length + vals.extras.length;
    const m = {...vals, date:vals.date || todayISO(), source:'PDF: ' + file.name, notes:[`Importado de ${file.name}`, vals.notes].filter(Boolean).join('. ')};
    const dup = S.measurements.find(x => x.date === m.date);
    const banner = `<div class="banner warn" style="margin-bottom:12px">${ic('warn')}<div><b>Revisá los valores antes de guardar.</b> ${nFound ? `Se detectaron ${nFound} datos` : 'No se detectaron datos'} ${method === 'ia' ? 'con Claude' : 'con el lector automático'}. Los campos vacíos no se encontraron en el informe.${vals.date ? '' : ' <b>No se encontró la fecha:</b> completala.'}${dup ? ` <b>Ya tenés una medición del ${fmtDate(m.date)}.</b> Si es la misma, cancelá y editala.` : ''}</div></div>`;
    closeSheet(true);
    openSheet('Medición importada', measForm(m, banner));
  } catch (err) {
    if (cancelled) return;
    console.warn(err);
    closeSheet(true); toast('No se pudo leer el PDF. Probá de nuevo o cargá la medición a mano.');
  }
}

const fs = () => S.food;
const r0 = n => Math.round(n || 0), r1 = n => Math.round((n || 0) * 10) / 10;
const fmt1 = n => n == null ? '—' : r1(n).toLocaleString('es-AR');
const dayItemsOf = date => fs().days[date] || [];
function totalsOf(items) { return items.reduce((t, e) => ({kcal:t.kcal + (e.kcal || 0), p:t.p + (e.p || 0), c:t.c + (e.c || 0), f:t.f + (e.f || 0)}), {kcal:0, p:0, c:0, f:0}); }
function fromPer100(per, grams) { const g = grams || 0; return {kcal:per.k * g / 100, p:per.p * g / 100, c:per.c * g / 100, f:per.f * g / 100}; }
function allFoods() { return [...fs().foods, ...FOOD_DB]; }
function findFood(id) { return allFoods().find(x => x.id === id); }
function recentFoodIds() {
  const seen = new Set(), out = [];
  Object.keys(fs().days).sort().reverse().forEach(d => fs().days[d].slice().reverse().forEach(e => { if (e.foodId && !seen.has(e.foodId) && findFood(e.foodId)) { seen.add(e.foodId); out.push(e.foodId); } }));
  return out.slice(0, 12);
}
function addEntries(date, list) { fs().days[date] = [...dayItemsOf(date), ...list]; }
const FD = () => UI.foodDate || todayISO();

    <div class="progress" style="height:9px;margin-top:5px"><i style="width:${target ? pct : 0}%;background:${over ? 'var(--down)' : col}"></i></div></div>`;
}

    <div class="lbl" style="margin-top:12px"><span>${q ? 'Resultados' : 'Recientes'}</span></div>
    ${list.length ? `<div class="stack" style="gap:6px">${list.map(row).join('')}</div>` : `<p class="small muted">${q ? 'No hay coincidencias. Probá con el código de barras o la carga manual (podés copiar los valores de la etiqueta).' : 'Todavía no hay recientes: buscá un alimento.'}</p>`}`;
}
function openAddFood(meal) {

  openSheet('Agregar a ' + label.toLowerCase(), `
    <div class="grid2"><button class="btn sm soft" data-act="food-barcode" data-meal="${meal}">▦ Código de barras</button><button class="btn sm soft" data-act="food-manual" data-meal="${meal}">✏️ Carga manual</button></div>

function qtySheet({food, meal, date, entry}) {
  const per = entry && entry.per100 ? entry.per100 : food ? {k:food.k, p:food.p, c:food.c, f:food.f} : null;
  const name = entry ? entry.name : food.name; const unit = food && food.unit ? food.unit : (entry && entry.unit) || null;
  const g0 = entry ? entry.grams : (unit ? unit.g : 100);
  const fixed = !per; // entrada manual con totales fijos
  openSheet(entry ? 'Editar' : name, `<form class="form" id="qtyform" data-food="${food ? food.id : ''}" data-meal="${meal || ''}" data-date="${date}" data-entry="${entry ? entry.id : ''}">
    ${entry ? `<div class="field"><label>Alimento</label><input name="name" value="${esc(name)}"></div>` : `<p class="muted" style="margin-top:-4px">${per ? `${per.k} kcal · P ${per.p} · C ${per.c} · G ${per.f} por 100 g` : ''}</p>`}
    ${entry ? `<div class="field"><label>Comida</label><select name="meal">${MEALS.map(([k, l]) => `<option value="${k}" ${entry.meal === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
    ${fixed ? `<div class="grid2">${[['kcal', 'Calorías', entry.kcal], ['p', 'Proteínas (g)', entry.p], ['c', 'Carbohidratos (g)', entry.c], ['f', 'Grasas (g)', entry.f]].map(([k, l, v]) => `<div class="field"><label>${l}</label><input name="${k}" inputmode="decimal" value="${fmt1(v).replace('.', ',')}"></div>`).join('')}</div>` : `
    <div class="lbl"><span>Cantidad</span>${unit ? `<span>1 ${esc(unit.name)} = ${unit.g} g</span>` : ''}</div>
    <div class="wrow"><label class="numin"><input id="foodqty" name="grams" inputmode="decimal" value="${g0 != null ? String(r1(g0)).replace('.', ',') : ''}" data-per='${per ? JSON.stringify(per) : ''}'><span>g</span></label></div>
    ${unit ? `<div class="row" style="gap:6px;flex-wrap:wrap">${[0.5, 1, 2, 3].map(n => `<button type="button" class="btn sm ghost" data-act="food-unit" data-g="${unit.g * n}">${n === 0.5 ? '½' : n} ${esc(unit.name)}</button>`).join('')}</div>` : ''}
    <div id="qtyprev" class="kv"></div>`}
    <button type="button" class="btn block" data-act="food-qty-save">${ic('check')} ${entry ? 'Guardar cambios' : 'Agregar'}</button>

  </form>`, sc => updateQtyPreview(sc));
}
function updateQtyPreview(root = document) {
  const inp = $('#foodqty', root); const box = $('#qtyprev', root); if (!inp || !box) return;
  const per = JSON.parse(inp.dataset.per || 'null'); if (!per) return; const v = fromPer100(per, num(inp.value) || 0);
  box.innerHTML = [['Calorías', r0(v.kcal), 'kcal'], ['Proteínas', fmt1(v.p), 'g'], ['Carbohidratos', fmt1(v.c), 'g'], ['Grasas', fmt1(v.f), 'g']].map(([l, x, u]) => `<div><span>${l}</span><b>${x} ${u}</b></div>`).join('');
}
function saveQty() {
  const f = $('#qtyform'); const fd = new FormData(f); const date = f.dataset.date;
  if (f.dataset.entry) {
    const e = dayItemsOf(date).find(x => x.id === f.dataset.entry); if (!e) return;
    if (fd.has('name')) e.name = fd.get('name').trim() || e.name;
    if (fd.has('meal')) e.meal = fd.get('meal');
    if (e.per100) { const g = num(fd.get('grams')); if (!g) return toast('Indicá los gramos.'); Object.assign(e, {grams:g}, fromPer100(e.per100, g)); }

  } else {
    const food = findFood(f.dataset.food); const g = num(fd.get('grams')); if (!g) return toast('Indicá los gramos.');
    addEntries(date, [{id:uid('fe'), meal:f.dataset.meal, name:food.name, foodId:food.id, grams:g, per100:{k:food.k, p:food.p, c:food.c, f:food.f}, unit:food.unit || null, src:food.src === 'base' ? 'base' : (food.src || 'propio'), ...fromPer100(food, g)}]);

}

/* ---------- carga manual y código de barras ---------- */
function openManual(meal) {
  openSheet('Carga manual', `<form class="form" id="manform" data-meal="${meal}">
    <div class="field"><label>Alimento</label><input name="name" required placeholder="ej. Empanada de carne casera"></div>
    <div class="field"><label>Los valores que vas a cargar son…</label><select name="basis"><option value="100">por 100 g</option><option value="total">de la porción que comiste (o la porción de la etiqueta)</option></select><span class="hint">Las etiquetas argentinas suelen informar por porción: elegí la segunda opción y poné los gramos de la porción.</span></div>
    <div class="grid2">${[['kcal', 'Calorías'], ['p', 'Proteínas (g)'], ['c', 'Carbohidratos (g)'], ['f', 'Grasas (g)']].map(([k, l]) => `<div class="field"><label>${l}</label><input name="${k}" inputmode="decimal"></div>`).join('')}</div>
    <div class="field"><label>Gramos que comiste</label><input name="grams" inputmode="decimal" placeholder="obligatorio si cargás por 100 g"></div>
    <label class="checkrow"><input type="checkbox" name="keep" checked> Guardar en mis alimentos para la próxima</label>
    <button type="button" class="btn block" data-act="food-manual-save">${ic('check')} Agregar</button></form>`);
}
function saveManual() {
  const f = $('#manform'); const fd = new FormData(f); const name = (fd.get('name') || '').trim(); if (!name) return toast('Poné el nombre.');
  const v = {kcal:num(fd.get('kcal')), p:num(fd.get('p')) || 0, c:num(fd.get('c')) || 0, f:num(fd.get('f')) || 0}; const g = num(fd.get('grams'));
  if (v.kcal == null) return toast('Cargá al menos las calorías.');
  let entry;
  if (fd.get('basis') === '100') {
    if (!g) return toast('Indicá los gramos que comiste.');
    const per = {k:v.kcal, p:v.p, c:v.c, f:v.f};
    let foodId = null;
    if (fd.has('keep')) { const nf = {id:uid('fd'), name, ...per, unit:null, src:'propio'}; fs().foods.unshift(nf); foodId = nf.id; }
    entry = {id:uid('fe'), meal:f.dataset.meal, name, foodId, grams:g, per100:per, src:'manual', ...fromPer100(per, g)};
  } else {
    const per = g ? {k:v.kcal / g * 100, p:v.p / g * 100, c:v.c / g * 100, f:v.f / g * 100} : null;
    let foodId = null;
    if (fd.has('keep') && per) { const nf = {id:uid('fd'), name, k:r1(per.k), p:r1(per.p), c:r1(per.c), f:r1(per.f), unit:{name:'porción', g}, src:'propio'}; fs().foods.unshift(nf); foodId = nf.id; }
    entry = {id:uid('fe'), meal:f.dataset.meal, name, foodId, grams:g || null, per100:per, src:'manual', kcal:v.kcal, p:v.p, c:v.c, f:v.f};
  }
  addEntries(FD(), [entry]); persist(true); closeSheet(); rerender(); toast('Agregado');
}
function openBarcode(meal) {
  openSheet('Código de barras', `<form class="form" id="bcform" data-meal="${meal}"><p class="small muted">Escribí los números que están debajo de las barras. Se busca en Open Food Facts, una base abierta: si el producto no está, cargalo a mano copiando la tabla nutricional del envase.</p>
    <div class="field"><label>Código</label><input name="code" inputmode="numeric" placeholder="ej. 7790070012345" autocomplete="off"></div>
    <button type="button" class="btn block" data-act="food-barcode-go">Buscar</button><div id="bcstatus" class="small muted"></div></form>`);
}
async function lookupBarcode() {
  const f = $('#bcform'); const code = (new FormData(f).get('code') || '').replace(/\D/g, ''); const meal = f.dataset.meal;
  if (code.length < 8) return toast('El código tiene que tener al menos 8 números.');
  const mine = fs().foods.find(x => x.barcode === code); if (mine) { closeSheet(true); return qtySheet({food:mine, meal, date:FD()}); }
  $('#bcstatus').textContent = 'Buscando…';
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,brands,nutriments,serving_quantity`);
    const d = await r.json(); const pr = d && d.product; const n = pr && pr.nutriments;
    const k = n && (n['energy-kcal_100g'] ?? (n['energy_100g'] != null ? n['energy_100g'] / 4.184 : null));
    if (!pr || k == null) { $('#bcstatus').textContent = 'No se encontró o no tiene datos nutricionales. Cargalo a mano con los valores de la etiqueta.'; return; }
    const nf = {id:uid('fd'), name:[pr.product_name_es || pr.product_name, pr.brands].filter(Boolean).join(' · ') || 'Producto ' + code, k:r1(k), p:r1(n.proteins_100g || 0), c:r1(n.carbohydrates_100g || 0), f:r1(n.fat_100g || 0),
      unit:pr.serving_quantity ? {name:'porción', g:+pr.serving_quantity} : null, barcode:code, src:'barcode'};
    fs().foods.unshift(nf); persist(true); closeSheet(true); qtySheet({food:nf, meal, date:FD()});
    toast('Encontrado. Revisá que coincida con el envase.');

/* ---------- 8. Acciones ---------- */
function startSession(dayKey, recoveryOf = null) {
  const ip = inProgressSession();
  if (ip) {
    if (ip.dayKey === dayKey && !!ip.recoveryOf === !!recoveryOf) { go('#/sesion/' + ip.id); return; }
    confirmSheet('Hay un entrenamiento en curso', 'Tenés otro entrenamiento sin finalizar. Abrilo para finalizarlo o descartarlo antes de empezar uno nuevo.', 'Abrir el que está en curso').then(ok => { if (ok) go('#/sesion/' + ip.id); });
    return;
  }
  const s = {id:uid('s'), blockId:S.activeBlockId, dayKey, type:'gym', date:todayISO(), status:'in_progress', startedAt:Date.now(), finishedAt:null, entries:{}, notes:''};
  if (recoveryOf) s.recoveryOf = recoveryOf;
  S.sessions.push(s); persist(true); go('#/sesion/' + s.id);
}
const curSession = () => { const h = CUR.match(/^sesion\/(.+)/); return h ? S.sessions.find(s => s.id === h[1]) : null; };
function ensureEntry(s, ex) {
  if (!s.entries[ex.id]) s.entries[ex.id] = {exId:ex.id, name:ex.name, target:{sets:ex.sets, repMin:ex.repMin, repMax:ex.repMax, unit:ex.unit, side:ex.side, rir:ex.rir}, weight:null, reps:[], rir:null, notes:'', saved:false, savedAt:null};
  return s.entries[ex.id];
}
function exOfSession(s, exId) { const blk = blockById(s.blockId) || activeBlock(); return dayOf(blk, s.dayKey).exercises.find(e => e.id === exId); }
function entryHasData(e) { return e && (e.weight != null || (e.reps || []).some(r => r != null && r !== '') || e.rir != null || e.notes); }

async function finishSession(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const blk = blockById(s.blockId); const day = dayOf(blk, s.dayKey);
  const unsaved = day.exercises.filter(ex => !s.entries[ex.id]?.saved && entryHasData(s.entries[ex.id]));
  const saved = day.exercises.filter(ex => s.entries[ex.id]?.saved).length;
  let msg = `Guardaste ${saved} de ${day.exercises.length} ejercicios.`;
  if (unsaved.length) msg += ` Hay ${unsaved.length} con datos cargados sin guardar (${unsaved.map(e => esc(e.name)).join(', ')}): se van a guardar tal como están.`;
  if (!saved && !unsaved.length) msg = 'No guardaste ningún ejercicio. ¿Finalizar igual?';
  if (!(await confirmSheet('Finalizar entrenamiento', msg, 'Finalizar'))) return;
  unsaved.forEach(ex => { const e = s.entries[ex.id]; e.saved = true; e.savedAt = Date.now(); });
  Object.keys(s.entries).forEach(k => { if (!s.entries[k].saved) delete s.entries[k]; });
  s.status = 'done'; s.finishedAt = Date.now(); await persist(true);
  toast('Entrenamiento finalizado'); go('#/entrenar');
}

function readExForm(form) {
  const fd = new FormData(form); const g = k => (fd.get(k) || '').toString().trim();
  const o = {name:g('name'), sub:g('sub'), sets:parseInt(g('sets')) || 0, repMin:parseInt(g('repMin')) || 0, repMax:parseInt(g('repMax')) || 0, unit:g('unit'), side:g('side'),
    weight:g('weight'), rir:g('rir'), section:g('section'), kind:g('kind'), region:g('region'), load:g('load'), tag:g('tag'),
    tech:lines(g('tech')), warn:lines(g('warn')), howto:lines(g('howto')), note:g('note'), machine:fd.has('machine'), optional:fd.has('optional'), bigJump:fd.has('bigJump')};
  if (!o.name) return 'Poné el nombre del ejercicio.';
  if (o.sets < 1 || o.sets > 10) return 'Las series tienen que estar entre 1 y 10.';
  if (o.repMin < 1) return 'Indicá el mínimo de repeticiones.';

}

async function exportBackup() {
  const payload = {app:'mi-rutina', schema:1, profile:PID, exportedAt:new Date().toISOString(), data:S};
  const json = JSON.stringify(payload, null, 2);
  const name = `mi-rutina-${PID}-respaldo-${todayISO()}.json`;
  const blob = new Blob([json], {type:'application/json'});
  const file = typeof File === 'function' ? new File([blob], name, {type:'application/json'}) : null;
  const markDone = () => { S.lastBackupAt = Date.now(); persist(true); rerender(); toast('Respaldo exportado'); };
  // Página publicada en claude.ai: la descarga pasa por la capacidad "downloads"
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({filename:name, data:json}); markDone(); }
    catch (err) { if (err && err.code !== 'declined') toast('No se pudo exportar el respaldo en esta vista.'); }
    return;
  }
  // iPhone: la hoja de compartir permite guardar en Archivos / iCloud
  if (file && navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    navigator.share({files:[file], title:'Respaldo Mi rutina'}).then(markDone).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markDone();
}
async function importBackup(file) {
  let payload;
  try { payload = JSON.parse(await file.text()); } catch (e) { toast('El archivo no es un JSON válido.'); return; }
  const data = payload && payload.data ? payload.data : payload;
  if (!data || !Array.isArray(data.blocks) || !Array.isArray(data.sessions)) { toast('El archivo no parece un respaldo de esta app.'); return; }
  const owner = payload.profile || data.profile;
  if (owner && owner !== PID && PROFILES[owner]) { toast(`Este respaldo es de ${PROFILES[owner].name}. Cambiá a ese perfil en Ajustes para importarlo.`); return; }
  const c = `${(data.sessions || []).filter(s => s.status === 'done').length} entrenamientos, ${(data.runs || []).length} salidas de running, ${(data.measurements || []).length} mediciones y ${data.blocks.length} bloque(s)`;
  const when = payload.exportedAt ? ` exportado el ${new Date(payload.exportedAt).toLocaleDateString('es-AR')}` : '';
  const ok = await confirmSheet('Importar respaldo', `El respaldo${when} contiene ${c}.<br><br><b>Va a reemplazar todos los datos actuales de esta app.</b> Si querés conservarlos, exportá primero un respaldo de lo actual.`, 'Reemplazar con el respaldo', true);
  if (!ok) return;
  S = normalize(data); await persist(true); UI.routineBlock = null; UI.editing = false;
  toast('Respaldo importado'); go('#/inicio');
}

document.addEventListener('change', e => {
  if (e.target.id === 'importfile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'pdffile' && e.target.files[0]) { importAnthropometryPdf(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S) Store.save(S).catch(() => {}); });
window.addEventListener('popstate', () => { try { CUR = location.hash.replace(/^#\/?/, '') || 'inicio'; } catch (e) {} closeSheet(true); route(); });

/* ---------- 9. Arranque ---------- */
function showChooser() { $('#nav').classList.add('hide'); closeSheet(true); $('#app').innerHTML = vChooser(); window.scrollTo(0, 0); }
async function activateProfile(pid, keepRoute = false) {
  if (!PROFILES[pid]) return showChooser();
  setProfile(pid);
  const data = await Store.load();
  const migrated = !!(data && data.__migrated);
  S = normalize(data || defaultState());
  if (!data || migrated) await persist(true); // guarda (o migra) bajo la clave del perfil
  go(keepRoute ? CUR : '#/inicio');
  if (migrated) toast('Tus datos anteriores quedaron en este perfil.');
}
(async function boot() {
  await Store.init();
  let pid = null; try { pid = localStorage.getItem('mi-rutina-perfil'); } catch (e) {}
  if (pid && PROFILES[pid]) await activateProfile(pid, true); else showChooser();
})();
</script>
