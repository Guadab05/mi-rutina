<title>Mi rutina</title>
<style>
/* ============ Tokens ============ */
:root{
  --bg:#F2F1F4; --surface:#FFFFFF; --surface2:#F7F6F9; --ink:#1E1A22; --mut:#6E6873; --line:#E4E1E8;
  --primary:#7A2E4F; --primary-ink:#FFFFFF;
  --mar:#9C3D5A; --jue:#3D4C7D; --sab:#6A4277; --run:#2E7366; --box:#8A8290;
  --warn-bg:#FFF1DC; --warn-ink:#6E420A; --warn-line:#E09A3E;
  --ok:#2E7366; --down:#B5513A; --hold:#6E6873;
  --edit:#2B2530; --track:#E7E5EB; --ok-bg:#E3F1EE; --ok-ink:#1E5249; --hold-bg:#EEEDF1; --hold-ink:#3E3843; --down-bg:#FBE9E6; --down-ink:#7D3020; --body2:#3E3843;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-size:16px;line-height:1.4;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ Layout ============ */
.app{max-width:720px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.topbar h1{font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.topbar .sub{color:var(--mut);font-size:14px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:2px}
.section-title{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title small{font-size:13px;color:var(--mut);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--mut)}
.small{font-size:13px}
.hide{display:none!important}

/* ============ Bottom nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--primary)}

/* ============ Surfaces ============ */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.card.flat{border:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.pill.c{background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.dash{background:transparent;border:1.5px dashed var(--c);color:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--primary);color:var(--primary-ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:color-mix(in srgb,var(--c,var(--primary)) 12%,var(--surface));color:var(--c,var(--primary))}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--down-bg);color:var(--down-ink)}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{color:var(--primary);font-weight:650;font-size:14.5px;padding:6px 2px;display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut);white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,26,34,.12)}

/* ============ Home ============ */
.hero{border-radius:22px;padding:18px;background:var(--c,var(--primary));color:#fff;position:relative;overflow:hidden}
.hero .k{font-size:13.5px;opacity:.85;font-weight:600}
.hero .t{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .d{font-size:15px;opacity:.92;margin-top:4px}
.hero .btn{background:#fff;color:var(--c,var(--primary));margin-top:14px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{background:rgba(255,255,255,.17);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 12px}

.wd{font:inherit;color:inherit;cursor:pointer;border-radius:12px;padding:8px 2px 9px;text-align:center;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;text-decoration:none}

.wd .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--mut)}
.wd .dot svg{width:14px;height:14px}
.wd.gym{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 25%,var(--surface))}
.wd.gym .act{color:var(--c)}
.wd.today{outline:2.5px solid var(--ink);outline-offset:1px}
.wd.done .dot{background:var(--ok);color:#fff}
.blockbar{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.38}
.banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line)}
.banner.info{background:color-mix(in srgb,var(--c,var(--primary)) 9%,var(--surface));color:var(--ink)}
.banner.info svg{color:var(--c,var(--primary))}
.banner.edit{background:var(--edit);color:#fff}

/* ============ Train hub ============ */
.daybtn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:left;width:100%}
.daybtn .sw{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:15px}
.daybtn .sw svg{width:24px;height:24px}
.daybtn .tx{flex:1;min-width:0}
.daybtn .tx b{display:block;font-size:18px;letter-spacing:-.01em}
.daybtn .tx span{display:block;font-size:14px;color:var(--mut);margin-top:1px}
.daybtn .chev{color:var(--mut)}
.daybtn.today{border:2px solid var(--c)}
.sat-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ Exercise cards ============ */
.ex{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;position:relative}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ex-in{padding:14px 14px 14px 18px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-n{font-size:18.5px;font-weight:780;letter-spacing:-.01em;line-height:1.2}
.ex-s{font-size:14px;color:var(--mut);margin-top:1px}
.ex-pos{font-size:12.5px;font-weight:750;color:var(--c);margin-bottom:2px}
.ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px;margin-top:11px}
.fact{background:var(--surface2);border-radius:10px;padding:6px 10px;min-width:0}
.fact .fl{font-size:11.5px;color:var(--mut);font-weight:600}
.fact .fv{font-size:16px;font-weight:750;line-height:1.2}
.fact.w{grid-column:1/-1}
.fact.w .fv{font-size:15px;font-weight:600}
.lastline{margin-top:10px;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lastline b{font-weight:750}
.lastline .muted{font-size:13px}
.tip{margin-top:9px;font-size:14.5px;color:var(--body2);display:flex;gap:7px;line-height:1.38}
.tip svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;color:var(--c)}
.warnline{margin-top:9px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line);border-radius:9px;padding:8px 10px;line-height:1.36;display:flex;gap:7px}
.warnline svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:#C77812}
details.acc{margin-top:10px;border-top:1px solid var(--line)}
details.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0 2px;font-weight:700;font-size:15px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{transition:transform .15s;color:var(--mut)}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc summary .sl{display:flex;align-items:center;gap:7px}
details.acc summary .sl svg{width:18px;height:18px}
.acc-body{padding:8px 0 2px;display:flex;flex-direction:column;gap:8px}
.acc-body ul{padding-left:18px;font-size:14.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.acc-body h5{font-size:13px;color:var(--mut);font-weight:700}
.note{font-size:14px;background:var(--surface2);border-radius:9px;padding:8px 10px;line-height:1.38;display:flex;gap:7px}
.note svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--c)}
.machnote{font-size:13.5px;color:var(--mut);display:flex;gap:6px;align-items:flex-start}
.machnote svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.grouphead{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-weight:750;font-size:15px;color:var(--c)}
.grouphead::after{content:"";flex:1;height:2px;background:var(--c);opacity:.22;border-radius:2px}
.ex.optional{border-style:dashed}

/* ============ Session ============ */
.sess-head{border-radius:22px;padding:16px 18px;background:var(--c);color:#fff;margin-bottom:12px}
.sess-head .t{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sess-head .d{font-size:14.5px;opacity:.9;margin-top:3px}
.sess-head .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.sess-head .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.sess-head .row{margin-top:10px;justify-content:space-between}
.sess-head input[type=date]{background:rgba(255,255,255,.17);border:none;border-radius:10px;color:#fff;padding:7px 10px;font-size:16px;font-weight:600;color-scheme:dark}
.log{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.lbl{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.wrow{display:flex;gap:8px;align-items:stretch}
.numin{flex:1;display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:0 12px;min-height:54px}
.numin input{width:100%;border:none;background:none;font-size:22px;font-weight:800;outline:none;padding:0}
.numin span{font-weight:700;color:var(--mut)}
.numin:focus-within{border-color:var(--c);background:var(--surface)}
.sets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:7px}
.set{background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:6px 4px 4px;text-align:center}
.set:focus-within{border-color:var(--c);background:var(--surface)}
.set .sn{font-size:11.5px;font-weight:700;color:var(--mut)}
.set input{width:100%;border:none;background:none;text-align:center;font-size:26px;font-weight:800;outline:none;padding:0 0 2px}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rir button{min-height:46px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:17px}
.rir button.on{background:var(--c);border-color:var(--c);color:#fff}
textarea,.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
textarea{min-height:70px;resize:vertical;line-height:1.4}
textarea:focus,.field input:focus,.field select:focus{border-color:var(--c,var(--primary));background:var(--surface)}
.sugg{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.38;display:flex;gap:8px}
.sugg svg{width:19px;height:19px;flex-shrink:0;margin-top:1px}
.sugg.up{background:var(--ok-bg);color:var(--ok-ink)}
.sugg.hold{background:var(--hold-bg);color:var(--hold-ink)}
.sugg.down{background:var(--down-bg);color:var(--down-ink)}
.sugg small{display:block;opacity:.75;font-size:12.5px;margin-top:2px}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok-ink)}
.saved b{font-size:15px}
.saved .muted{color:var(--ok-ink);opacity:.8}
.ex.is-saved::before{background:var(--ok)}
.tick{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tick svg{width:16px;height:16px}
.sticky-finish{margin-top:16px}

/* ============ Charts / lists ============ */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--track);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .lv{font-size:12.5px;font-weight:800}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:15px;text-align:left;width:100%;text-decoration:none}
.listrow .mid{flex:1;min-width:0}
.listrow .mid b{display:block;font-size:16px;line-height:1.25}
.listrow .mid span{display:block;font-size:13.5px;color:var(--mut);margin-top:1px}
.listrow .bar{width:5px;align-self:stretch;border-radius:5px;background:var(--c);flex-shrink:0}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface2);border-radius:13px;padding:11px 13px}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow .top b{font-size:15px}
.hrow .reps{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:.01em}
.hrow .reps small{font-size:13px;font-weight:650;color:var(--mut);margin-left:6px}
.hrow .n{font-size:13.5px;color:var(--mut);margin-top:4px}
.trend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:15px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:6px 10px}
.kv span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kv b{font-size:15.5px}

/* ============ Sheet / modal ============ */
.scrim{position:fixed;inset:0;background:rgba(30,26,34,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.scrim.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-h h3{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sheet-b{padding:4px 16px calc(var(--safe-b) + 20px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:700;color:var(--mut)}
.field .hint{font-size:12.5px;color:var(--mut)}
.checkrow{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.checkrow input{width:22px;height:22px;accent-color:var(--primary)}
.form{display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-weight:650;font-size:14.5px;z-index:80;opacity:0;transition:all .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ============ Routine / edit ============ */
.blockchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.blockchips::-webkit-scrollbar{display:none}
.blockchips button{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px}
.blockchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.blockchips button small{font-weight:600;opacity:.7;margin-left:4px}
.editing .ex{border:1.5px dashed #8A7F8E}
.edit-tools{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.edit-tools .btn{flex:1}
.dayhead{border-radius:18px;padding:14px 16px;background:var(--c);color:#fff;margin-top:16px}
.dayhead b{font-size:21px;letter-spacing:-.01em}
.dayhead span{display:block;font-size:14.5px;opacity:.92}
.dayhead p{font-size:13.5px;opacity:.88;margin-top:6px}
.guide h4{font-size:16.5px;margin-bottom:6px}
.guide p,.guide li{font-size:15px;line-height:1.48}
.guide ul,.guide ol{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.progrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--c)}
.progrow b{font-size:17px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--c);color:#fff}
.step.later .n{background:var(--surface);color:var(--mut);border:2px dashed #B8B0BC}
.step b{display:block;font-size:15.5px;margin-top:5px}
.step span{display:block;font-size:14px;color:var(--mut)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.c,:root:not([data-theme="light"]) .ex-pos,:root:not([data-theme="light"]) .grouphead,:root:not([data-theme="light"]) .wd.gym .act,:root:not([data-theme="light"]) .pill.dash,:root:not([data-theme="light"]) .btn.soft,:root:not([data-theme="light"]) .tip svg,:root:not([data-theme="light"]) .th{color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}}
:root[data-theme="dark"] .pill.c,:root[data-theme="dark"] .ex-pos,:root[data-theme="dark"] .grouphead,:root[data-theme="dark"] .wd.gym .act,:root[data-theme="dark"] .pill.dash,:root[data-theme="dark"] .btn.soft{color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}
</style>

'use strict';
/* =====================================================================

/* ---------- 1. Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

const WD = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* ---------- 2. Íconos ---------- */
const P = {

const Store = {
  mode:'memory', db:null, DB:'mi-rutina', OS:'kv', KEY:'state', LS:'mi-rutina-state',
  async init() {
    try {
      if (!window.indexedDB) throw new Error('sin indexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(this.DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(this.OS);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      this.mode = 'indexeddb';
    } catch (e) {
      try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
    }
  },
  async load() {
    let data = null;
    if (this.mode === 'indexeddb') {
      data = await new Promise(res => { try {
        const g = this.db.transaction(this.OS, 'readonly').objectStore(this.OS).get(this.KEY);
        g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
      } catch (e) { res(null); } });
    }
    if (!data) { try { const t = localStorage.getItem(this.LS); if (t) data = JSON.parse(t); } catch (e) {} }
    return data;
  },
  async save(obj) {
    const json = JSON.stringify(obj);
    if (this.mode === 'indexeddb') {
      await new Promise((res, rej) => {
        const tx = this.db.transaction(this.OS, 'readwrite');
        tx.objectStore(this.OS).put(JSON.parse(json), this.KEY);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    // copia espejo en localStorage (segunda red de seguridad)
    try { localStorage.setItem(this.LS, json); } catch (e) {}
  },
};

    sc.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) finish(b.dataset.x === 'ok'); if (e.target.closest('[data-act="sheet-close"]') || e.target === sc) finish(false); });
  });
}

function lineChart(pts, {color = 'var(--primary)', unit = '', h = 180} = {}) {
  pts = pts.filter(p => p.y != null).sort((a, b) => a.x.localeCompare(b.x));
  if (!pts.length) return `<div class="empty small">Sin datos todavía.</div>`;
  const W = 340, H = h, pl = 38, pr = 14, pt = 18, pb = 26;
  const t0 = parseISO(pts[0].x).getTime(), t1 = parseISO(pts[pts.length - 1].x).getTime();
  const sameX = t1 === t0;
  const X = (p, i) => sameX ? (pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1)) : pl + (parseISO(p.x).getTime() - t0) / (t1 - t0) * (W - pl - pr);
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (hi - lo < 1) { lo -= 1; hi += 1; } const padY = (hi - lo) * .15; lo -= padY; hi += padY;
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const ticks = [lo + (hi - lo) * .1, (lo + hi) / 2, hi - (hi - lo) * .1];
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p, i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const last = pts[pts.length - 1], li = pts.length - 1;
  const lx = X(last, li), ly = Y(last.y);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución">
    ${ticks.map(t => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t, 1)}</text>`).join('')}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(p, i)}" cy="${Y(p.y)}" r="${i === li ? 5 : 3.4}" fill="${i === li ? color : 'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join('')}
    <text class="lv" x="${Math.min(lx, W - pr - 2)}" y="${Math.max(ly - 10, 12)}" text-anchor="${lx > W - 60 ? 'end' : 'middle'}" fill="${color}">${fmtN(last.y, 2)}${unit ? ' ' + unit : ''}</text>
    <text class="ax" x="${pl}" y="${H - 6}">${fmtDate(pts[0].x)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtDate(last.x)}</text>` : ''}
  </svg>${pts.length === 1 ? '<p class="small muted" style="text-align:center;margin-top:4px">Con un segundo registro vas a ver la evolución.</p>' : ''}`;
}
function sparkline(vals, color) {
  vals = vals.filter(v => v != null); if (vals.length < 2) return '';
  const W = 70, H = 26; const lo = Math.min(...vals), hi = Math.max(...vals); const r = hi - lo || 1;
  const pts = vals.map((v, i) => `${(i * (W - 4) / (vals.length - 1) + 2).toFixed(1)},${(H - 3 - (v - lo) / r * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* Bloque reutilizable de indicaciones (técnica + salvedades + nota + aviso de máquina) */
function indications(ex, open = false) {
  const hasWarn = ex.warn.length > 0;
  const parts = [];
  if (ex.warn.length) parts.push(ex.warn.map(w => `<div class="warnline" style="margin-top:0">${ic('warn', 17)}<div>${esc(w)}</div></div>`).join(''));
  if (ex.tech.length) parts.push(`<div><h5>Técnica</h5><ul>${ex.tech.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`);
  if (ex.note) parts.push(`<div class="note">${ic('info', 17)}<div>${esc(ex.note)}</div></div>`);
  if (ex.machine) parts.push(`<div class="machnote">${ic('gear', 16)}<div>${esc(MACHINE_WARN)}</div></div>`);
  if (!parts.length) return '';
  const label = hasWarn ? `<span class="sl" style="color:var(--warn-ink)">${ic('warn', 18)} Indicaciones y salvedades</span>` : `<span class="sl">${ic('target', 18)} Ver técnica</span>`;

function sessionCard(s, ex, pos, color) {

  const lastLine = `<div class="lastline"><span class="muted">Última sesión:</span>${last ? `<b>${esc(entryLine(last))}</b><span class="muted">${fmtDate(last.date)}</span>` : '<span class="muted">sin registros</span>'}</div>`;
  if (e.saved) {

      <div class="saved"><div><b>${esc(entryLine(e))}</b>${e.notes ? `<div class="small muted">${esc(e.notes)}</div>` : ''}</div><span class="tick">${ic('check')}</span></div>
      ${nextSug ? `<div class="sugg ${nextSug.lvl}">${ic(nextSug.icon, 19)}<div><b>Para la próxima:</b> ${esc(nextSug.text)}${nextSug.extra ? `<small>${esc(nextSug.extra)}</small>` : ''}<small>Sugerencia: el peso no se modifica automáticamente.</small></div></div>` : ''}
      <button class="btn sm ghost block" style="margin-top:10px" data-act="entry-edit" data-ex="${ex.id}">${ic('edit', 17)} Editar registro</button>

  }
  const n = ex.sets; const unitLbl = ex.unit === 'seg' ? 'seg' : 'reps';

/* ---------- Importación de antropometrías desde PDF ----------
   1) pdf.js (cargado solo cuando se usa) extrae el texto y renderiza las páginas.
   2) Si la app corre dentro de Claude, Claude lee el informe (texto + imágenes).
      Fuera de Claude se usa un lector automático por reglas.
   3) Siempre se muestran los valores para revisar antes de guardar. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
function loadScript(src) { return new Promise((res, rej) => { const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(t); }); }
async function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;
  if (!window.pdfjsLib) await loadScript(PDFJS + '/pdf.min.js');
  // El worker se carga en el hilo principal: evita depender de Web Workers externos
  if (!window.pdfjsWorker) await loadScript(PDFJS + '/pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + '/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function readPdf(file, {maxImages = 0} = {}) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const pages = Math.min(pdf.numPages, 6); const textLines = []; const images = [];
  for (let p = 1; p <= pages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x:it.transform[4], s:it.str}); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => textLines.push(items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join('   ')));
    if (images.length < maxImages) {

const ANTHRO_PROMPT = text => `Sos un asistente que transcribe informes antropométricos de nutricionistas (formato ISAK, fraccionamiento en 5 componentes de Kerr, bioimpedancia u otros).

{"date": "YYYY-MM-DD" o null,
 "weight": kg o null,
 "muscleKg": kg o null, "musclePct": porcentaje o null,
 "fatKg": kg o null, "fatPct": porcentaje o null,
 "waist": cm o null (cintura; la mínima si hay varias),
 "hip": cm o null (cadera; la máxima),
 "thigh": cm o null (muslo; el medial si hay varios, y aclaralo en extras si es otro),
 "arm": cm o null (brazo relajado),
 "extras": [{"label": "Masa ósea", "value": "9.1", "unit": "kg"}],
 "notes": "aclaraciones breves sobre ambigüedades, o cadena vacía"}

En "extras" incluí, si aparecen: masa ósea, masa residual, masa de piel (kg y %), sumatoria de pliegues (mm), IMC, brazo contraído, pantorrilla, tórax, otros perímetros o pliegues relevantes. Máximo 16 extras. "Masa adiposa" y "masa grasa" son lo mismo.

Texto extraído del PDF (las columnas pueden venir desordenadas; si hay imágenes de las páginas, usalas para verificar):
<<<
${text.slice(0, 60000)}
>>>`;

/* Lector por reglas (sin IA): busca etiquetas típicas y los números de la misma fila */
function parseAnthropometryText(text) {
  const L = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const nums = l => [...l.matchAll(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(kg|%|cm|mm)?(?![\d\/])/gi)].map(m => ({v:parseFloat(m[1].replace(',', '.')), u:(m[2] || '').toLowerCase()}));
  let order = ['kg', '%']; // orden de columnas si un encabezado lo indica
  const head = L.find(l => /\bkg\b/i.test(l) && /%/.test(l) && !/\d/.test(l.replace(/\d+\s*componentes/i, '')));
  if (head && head.indexOf('%') < head.toLowerCase().indexOf('kg')) order = ['%', 'kg'];
  const out = {extras:[]}; const found = (k, v) => { if (out[k] == null && v != null) out[k] = v; };
  const fmt = v => String(v).replace('.', ',');
  const pair = (line, kgRange) => {
    const ns = nums(line.replace(/^[^\d]*?(masa|peso|grasa)[^\d]*/i, ''));
    let kg = ns.find(n => n.u === 'kg')?.v ?? null, pct = ns.find(n => n.u === '%')?.v ?? null;
    const bare = ns.filter(n => !n.u).map(n => n.v);
    if (kg == null && pct == null && bare.length >= 2) { [kg, pct] = order[0] === 'kg' ? [bare[0], bare[1]] : [bare[1], bare[0]]; }
    else if (kg == null && bare.length) kg = bare[0];
    else if (pct == null && bare.length && kg != null) pct = bare[0];
    if (kg != null && (kg < kgRange[0] || kg > kgRange[1])) kg = null;
    if (pct != null && (pct <= 0 || pct >= 100)) pct = null;
    return {kg, pct};
  };
  const cm = (line, lo, hi) => { const n = nums(line).find(x => (x.u === 'cm' || !x.u) && x.v >= lo && x.v <= hi); return n ? n.v : null; };
  for (const l of L) {
    const n = normName(l);
    if (/^(peso|peso corporal|peso actual|masa corporal)\b/.test(n) && !/ideal|oseo|graso|magro|residual|objetivo|meta|perdid/.test(n)) { const x = nums(l).find(v => v.v >= 30 && v.v <= 250); found('weight', x ? x.v : null); }
    else if (/masa (muscular|musculo esqueletica)/.test(n)) { const p = pair(l, [10, 120]); found('muscleKg', p.kg); found('musclePct', p.pct); }
    else if (/masa (adiposa|grasa)|grasa corporal/.test(n)) { const p = pair(l, [3, 150]); found('fatKg', p.kg); found('fatPct', p.pct); }
    else if (/masa osea/.test(n)) { const p = pair(l, [1, 30]); if (p.kg != null) out.extras.push({label:'Masa ósea', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa residual/.test(n)) { const p = pair(l, [1, 40]); if (p.kg != null) out.extras.push({label:'Masa residual', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa (de )?piel/.test(n)) { const p = pair(l, [0.5, 15]); if (p.kg != null) out.extras.push({label:'Masa de piel', value:fmt(p.kg), unit:'kg'}); }
    else if (/^cintura/.test(n)) found('waist', cm(l, 40, 220));
    else if (/^cadera/.test(n)) found('hip', cm(l, 50, 220));
    else if (/^muslo/.test(n)) found('thigh', cm(l, 25, 120));
    else if (/^brazo/.test(n) && !/contraid|flexionad/.test(n)) found('arm', cm(l, 15, 70));
    else if (/^brazo/.test(n)) { const v = cm(l, 15, 70); if (v != null) out.extras.push({label:'Brazo contraído', value:fmt(v), unit:'cm'}); }
    else if (/^pantorrilla/.test(n)) { const v = cm(l, 20, 80); if (v != null) out.extras.push({label:'Pantorrilla', value:fmt(v), unit:'cm'}); }
    else if (/sumatoria|suma de (6|seis|8|ocho) pliegues/.test(n)) { const x = nums(l).filter(v => v.v >= 20 && v.v <= 400).pop(); if (x) out.extras.push({label:'Sumatoria de pliegues', value:fmt(x.v), unit:'mm'}); }
    else if (/^imc\b|indice de masa corporal/.test(n)) { const x = nums(l).find(v => v.v >= 12 && v.v <= 70); if (x) out.extras.push({label:'IMC', value:fmt(x.v), unit:''}); }
  }
  const dm = text.match(/fecha[^0-9]{0,25}(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/i) || text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2})\b/);
  if (dm) { let y = +dm[3]; if (y < 100) y += 2000; const d = +dm[1], m = +dm[2]; if (m >= 1 && m <= 12 && d >= 1 && d <= 31) out.date = `${y}-${pad(m)}-${pad(d)}`; }
  return out;
}
function cleanAnthro(v) {
  const o = {date:/^\d{4}-\d{2}-\d{2}$/.test(v?.date || '') ? v.date : null, extras:[]};
  ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'].forEach(k => o[k] = num(v?.[k]));
  o.extras = (Array.isArray(v?.extras) ? v.extras : []).slice(0, 16).map(x => ({label:String(x?.label || '').trim(), value:String(x?.value ?? '').replace('.', ',').trim(), unit:String(x?.unit || '').trim()})).filter(x => x.label && x.value);
  o.notes = typeof v?.notes === 'string' ? v.notes.trim() : '';
  return o;
}
async function importAnthropometryPdf(file) {
  let cancelled = false;
  const sc = openSheet('Importar antropometría', `<div class="stack"><div class="banner info">${ic('clock')}<div id="pdfstatus">Leyendo el PDF…</div></div><button class="btn block ghost" id="pdfcancel">Cancelar</button></div>`);
  const status = t => { const el = $('#pdfstatus'); if (el) el.textContent = t; };
  $('#pdfcancel', sc).onclick = () => { cancelled = true; closeSheet(); };
  try {
    const sample = await getSample();
    const caps = sample ? await sample.limits().catch(() => null) : null;
    const maxImages = caps?.images ? Math.min(caps.images.maxCount || 3, 3) : 0;
    const {text, images} = await readPdf(file, {maxImages});
    if (cancelled) return;
    let vals = null, method = '';
    if (sample && (text.trim().length > 40 || images.length)) {
      status('Claude está leyendo el informe… puede tardar hasta un minuto.');
      try { vals = cleanAnthro(await sample.json(ANTHRO_PROMPT(text || '(sin texto: es un PDF escaneado, usá las imágenes)'), images.length ? {images} : {})); method = 'ia'; }
      catch (e) { if (cancelled) return; vals = null; }
    }
    if (!vals) {
      if (text.trim().length < 40) { closeSheet(true); toast('El PDF parece escaneado y no se pudo leer automáticamente. Cargá los valores a mano.'); openSheet('Nueva medición', measForm()); return; }
      vals = cleanAnthro(parseAnthropometryText(text)); method = 'reglas';
    }
    if (cancelled) return;
    const keys = ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'];
    const nFound = keys.filter(k => vals[k] != null).length + vals.extras.length;
    const m = {...vals, date:vals.date || todayISO(), source:'PDF: ' + file.name, notes:[`Importado de ${file.name}`, vals.notes].filter(Boolean).join('. ')};
    const dup = S.measurements.find(x => x.date === m.date);
    const banner = `<div class="banner warn" style="margin-bottom:12px">${ic('warn')}<div><b>Revisá los valores antes de guardar.</b> ${nFound ? `Se detectaron ${nFound} datos` : 'No se detectaron datos'} ${method === 'ia' ? 'con Claude' : 'con el lector automático'}. Los campos vacíos no se encontraron en el informe.${vals.date ? '' : ' <b>No se encontró la fecha:</b> completala.'}${dup ? ` <b>Ya tenés una medición del ${fmtDate(m.date)}.</b> Si es la misma, cancelá y editala.` : ''}</div></div>`;
    closeSheet(true);
    openSheet('Medición importada', measForm(m, banner));
  } catch (err) {
    if (cancelled) return;
    console.warn(err);
    closeSheet(true); toast('No se pudo leer el PDF. Probá de nuevo o cargá la medición a mano.');
  }
}

/* ---------- 8. Acciones ---------- */
function startSession(dayKey) {
  const ip = inProgressSession();
  if (ip) {
    if (ip.dayKey === dayKey) { go('#/sesion/' + ip.id); return; }
    confirmSheet('Hay un entrenamiento en curso', 'Tenés otro entrenamiento sin finalizar. Abrilo para finalizarlo o descartarlo antes de empezar uno nuevo.', 'Abrir el que está en curso').then(ok => { if (ok) go('#/sesion/' + ip.id); });
    return;
  }
  const s = {id:uid('s'), blockId:S.activeBlockId, dayKey, type:'gym', date:todayISO(), status:'in_progress', startedAt:Date.now(), finishedAt:null, entries:{}, notes:''};
  S.sessions.push(s); persist(true); go('#/sesion/' + s.id);
}
const curSession = () => { const h = CUR.match(/^sesion\/(.+)/); return h ? S.sessions.find(s => s.id === h[1]) : null; };
function ensureEntry(s, ex) {
  if (!s.entries[ex.id]) s.entries[ex.id] = {exId:ex.id, name:ex.name, target:{sets:ex.sets, repMin:ex.repMin, repMax:ex.repMax, unit:ex.unit, side:ex.side, rir:ex.rir}, weight:null, reps:[], rir:null, notes:'', saved:false, savedAt:null};
  return s.entries[ex.id];
}
function exOfSession(s, exId) { const blk = blockById(s.blockId) || activeBlock(); return dayOf(blk, s.dayKey).exercises.find(e => e.id === exId); }
function entryHasData(e) { return e && (e.weight != null || (e.reps || []).some(r => r != null && r !== '') || e.rir != null || e.notes); }

async function finishSession(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const blk = blockById(s.blockId); const day = dayOf(blk, s.dayKey);
  const unsaved = day.exercises.filter(ex => !s.entries[ex.id]?.saved && entryHasData(s.entries[ex.id]));
  const saved = day.exercises.filter(ex => s.entries[ex.id]?.saved).length;
  let msg = `Guardaste ${saved} de ${day.exercises.length} ejercicios.`;
  if (unsaved.length) msg += ` Hay ${unsaved.length} con datos cargados sin guardar (${unsaved.map(e => esc(e.name)).join(', ')}): se van a guardar tal como están.`;
  if (!saved && !unsaved.length) msg = 'No guardaste ningún ejercicio. ¿Finalizar igual?';
  if (!(await confirmSheet('Finalizar entrenamiento', msg, 'Finalizar'))) return;
  unsaved.forEach(ex => { const e = s.entries[ex.id]; e.saved = true; e.savedAt = Date.now(); });
  Object.keys(s.entries).forEach(k => { if (!s.entries[k].saved) delete s.entries[k]; });
  s.status = 'done'; s.finishedAt = Date.now(); await persist(true);
  toast('Entrenamiento finalizado'); go('#/entrenar');
}

function readExForm(form) {
  const fd = new FormData(form); const g = k => (fd.get(k) || '').toString().trim();
  const o = {name:g('name'), sub:g('sub'), sets:parseInt(g('sets')) || 0, repMin:parseInt(g('repMin')) || 0, repMax:parseInt(g('repMax')) || 0, unit:g('unit'), side:g('side'),
    weight:g('weight'), rir:g('rir'), section:g('section'), kind:g('kind'), region:g('region'), load:g('load'), tag:g('tag'),
    tech:lines(g('tech')), warn:lines(g('warn')), note:g('note'), machine:fd.has('machine'), optional:fd.has('optional'), bigJump:fd.has('bigJump')};
  if (!o.name) return 'Poné el nombre del ejercicio.';
  if (o.sets < 1 || o.sets > 10) return 'Las series tienen que estar entre 1 y 10.';
  if (o.repMin < 1) return 'Indicá el mínimo de repeticiones.';
  if (!o.repMax) o.repMax = o.repMin;
  if (o.repMax < o.repMin) return 'El máximo de repeticiones no puede ser menor que el mínimo.';
  return o;
}

async function exportBackup() {
  const payload = {app:'mi-rutina', schema:1, exportedAt:new Date().toISOString(), data:S};
  const json = JSON.stringify(payload, null, 2);
  const name = `mi-rutina-respaldo-${todayISO()}.json`;
  const blob = new Blob([json], {type:'application/json'});
  const file = typeof File === 'function' ? new File([blob], name, {type:'application/json'}) : null;
  const markDone = () => { S.lastBackupAt = Date.now(); persist(true); rerender(); toast('Respaldo exportado'); };
  // Página publicada en claude.ai: la descarga pasa por la capacidad "downloads"
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({filename:name, data:json}); markDone(); }
    catch (err) { if (err && err.code !== 'declined') toast('No se pudo exportar el respaldo en esta vista.'); }
    return;
  }
  // iPhone: la hoja de compartir permite guardar en Archivos / iCloud
  if (file && navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    navigator.share({files:[file], title:'Respaldo Mi rutina'}).then(markDone).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markDone();
}
async function importBackup(file) {
  let payload;
  try { payload = JSON.parse(await file.text()); } catch (e) { toast('El archivo no es un JSON válido.'); return; }
  const data = payload && payload.data ? payload.data : payload;
  if (!data || !Array.isArray(data.blocks) || !Array.isArray(data.sessions)) { toast('El archivo no parece un respaldo de esta app.'); return; }
  const c = `${(data.sessions || []).filter(s => s.status === 'done').length} entrenamientos, ${(data.runs || []).length} salidas de running, ${(data.measurements || []).length} mediciones y ${data.blocks.length} bloque(s)`;
  const when = payload.exportedAt ? ` exportado el ${new Date(payload.exportedAt).toLocaleDateString('es-AR')}` : '';
  const ok = await confirmSheet('Importar respaldo', `El respaldo${when} contiene ${c}.<br><br><b>Va a reemplazar todos los datos actuales de esta app.</b> Si querés conservarlos, exportá primero un respaldo de lo actual.`, 'Reemplazar con el respaldo', true);
  if (!ok) return;
  S = normalize(data); await persist(true); UI.routineBlock = null; UI.editing = false;
  toast('Respaldo importado'); go('#/inicio');
}

      old.status = 'closed'; old.endDate = todayISO(); S.blocks.push(nb); S.activeBlockId = nb.id; UI.routineBlock = nb.id; UI.editing = true; UI.routineTab = 'dias';
      await persist(true); closeSheet(); rerender(); toast(`${nb.name} creado. Editá lo que quieras cambiar.`); break; }
    // Ajustes
    case 'export': exportBackup(); break;
    case 'persist': if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); toast(ok ? 'Almacenamiento persistente activado' : 'El navegador no lo concedió. Seguí exportando respaldos.'); } else toast('Este navegador no ofrece esa opción.'); break;
    case 'reset': if (await confirmSheet('Borrar todos los datos', 'Se borran entrenamientos, mediciones, bloques y cambios de rutina. <b>No se puede deshacer.</b> Exportá un respaldo antes si lo necesitás.', 'Borrar todo', true)) { S = defaultState(); await persist(true); UI.routineBlock = null; toast('Datos borrados'); go('#/inicio'); } break;
  }
});

// Entrada de datos en la sesión: se guarda como borrador al escribir (no se pierde si se bloquea el celular)
document.addEventListener('input', e => {
  const t = e.target; const s = curSession(); if (!s) return;
  if (t.dataset.sfield) { if (t.dataset.sfield === 'date' && !t.value) return; s[t.dataset.sfield] = t.value; persist(); return; }
  const log = t.closest('.log'); if (!log || !t.dataset.efield) return;
  const ex = exOfSession(s, log.dataset.ex); const en = ensureEntry(s, ex);
  if (t.dataset.efield === 'weight') en.weight = num(t.value);
  else if (t.dataset.efield === 'rep') { const reps = en.reps || []; reps[+t.dataset.i] = t.value === '' ? null : parseInt(t.value); en.reps = Array.from({length:ex.sets}, (_, i) => Number.isFinite(reps[i]) ? reps[i] : null); }
  else if (t.dataset.efield === 'notes') en.notes = t.value;
  persist();
});
document.addEventListener('change', e => {
  if (e.target.id === 'importfile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'pdffile' && e.target.files[0]) { importAnthropometryPdf(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S) Store.save(S).catch(() => {}); });
window.addEventListener('popstate', () => { try { CUR = location.hash.replace(/^#\/?/, '') || 'inicio'; } catch (e) {} closeSheet(true); route(); });

/* ---------- 9. Arranque ---------- */
(async function boot() {
  await Store.init();
  const data = await Store.load();
  S = normalize(data || defaultState());
  if (!data) await persist(true);
  route();
})();
</script>
</body>
