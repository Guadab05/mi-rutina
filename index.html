/* ---------- Importación de antropometrías desde PDF ----------
   1) pdf.js (cargado solo cuando se usa) extrae el texto y renderiza las páginas.
   2) Si la app corre dentro de Claude, Claude lee el informe (texto + imágenes).
      Fuera de Claude se usa un lector automático por reglas.
   3) Siempre se muestran los valores para revisar antes de guardar. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
function loadScript(src) { return new Promise((res, rej) => { const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(t); }); }
async function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;
  if (!window.pdfjsLib) await loadScript(PDFJS + '/pdf.min.js');
  // El worker se carga en el hilo principal: evita depender de Web Workers externos
  if (!window.pdfjsWorker) await loadScript(PDFJS + '/pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + '/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function readPdf(file, {maxImages = 0} = {}) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const pages = Math.min(pdf.numPages, 6); const textLines = []; const images = [];
  for (let p = 1; p <= pages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3) * 3; if (!rows.has(y)) rows.set(y, []); rows.get(y).push({x:it.transform[4], s:it.str}); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => textLines.push(items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join('   ')));
    if (images.length < maxImages) {
      const vp0 = page.getViewport({scale:1}); const scale = Math.min(2.2, 1400 / vp0.width); const vp = page.getViewport({scale});
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      images.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86)));
    }
  }
  return {text:textLines.join('\n'), images, numPages:pdf.numPages};
}
async function getSample() {
  if (!window.claude || typeof window.claude.use !== 'function') return null;
  try { return await window.claude.use('sample'); } catch (e) { return null; }
}
const ANTHRO_PROMPT = text => `Sos un asistente que transcribe informes antropométricos de nutricionistas (formato ISAK, fraccionamiento en 5 componentes de Kerr, bioimpedancia u otros).
Extraé SOLO valores que figuren explícitamente en el informe. No calcules, no estimes, no completes. Si un dato no está, usá null.
Números con punto decimal (ej. 41.28). Fecha en formato YYYY-MM-DD (fecha de la medición, no de nacimiento).

Respondé SOLO con un objeto JSON con esta forma exacta:
{"date": "YYYY-MM-DD" o null,
 "weight": kg o null,
 "muscleKg": kg o null, "musclePct": porcentaje o null,
 "fatKg": kg o null, "fatPct": porcentaje o null,
 "waist": cm o null (cintura; la mínima si hay varias),
 "hip": cm o null (cadera; la máxima),
 "thigh": cm o null (muslo; el medial si hay varios, y aclaralo en extras si es otro),
 "arm": cm o null (brazo relajado),
 "extras": [{"label": "Masa ósea", "value": "9.1", "unit": "kg"}],
 "notes": "aclaraciones breves sobre ambigüedades, o cadena vacía"}

En "extras" incluí, si aparecen: masa ósea, masa residual, masa de piel (kg y %), sumatoria de pliegues (mm), IMC, brazo contraído, pantorrilla, tórax, otros perímetros o pliegues relevantes. Máximo 16 extras. "Masa adiposa" y "masa grasa" son lo mismo.

Texto extraído del PDF (las columnas pueden venir desordenadas; si hay imágenes de las páginas, usalas para verificar):
<<<
${text.slice(0, 60000)}
>>>`;

/* Lector por reglas (sin IA): busca etiquetas típicas y los números de la misma fila */
function parseAnthropometryText(text) {
  const L = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const nums = l => [...l.matchAll(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(kg|%|cm|mm)?(?![\d\/])/gi)].map(m => ({v:parseFloat(m[1].replace(',', '.')), u:(m[2] || '').toLowerCase()}));
  let order = ['kg', '%']; // orden de columnas si un encabezado lo indica
  const head = L.find(l => /\bkg\b/i.test(l) && /%/.test(l) && !/\d/.test(l.replace(/\d+\s*componentes/i, '')));
  if (head && head.indexOf('%') < head.toLowerCase().indexOf('kg')) order = ['%', 'kg'];
  const out = {extras:[]}; const found = (k, v) => { if (out[k] == null && v != null) out[k] = v; };
  const fmt = v => String(v).replace('.', ',');
  const pair = (line, kgRange) => {
    const ns = nums(line.replace(/^[^\d]*?(masa|peso|grasa)[^\d]*/i, ''));
    let kg = ns.find(n => n.u === 'kg')?.v ?? null, pct = ns.find(n => n.u === '%')?.v ?? null;
    const bare = ns.filter(n => !n.u).map(n => n.v);
    if (kg == null && pct == null && bare.length >= 2) { [kg, pct] = order[0] === 'kg' ? [bare[0], bare[1]] : [bare[1], bare[0]]; }
    else if (kg == null && bare.length) kg = bare[0];
    else if (pct == null && bare.length && kg != null) pct = bare[0];
    if (kg != null && (kg < kgRange[0] || kg > kgRange[1])) kg = null;
    if (pct != null && (pct <= 0 || pct >= 100)) pct = null;
    return {kg, pct};
  };
  const cm = (line, lo, hi) => { const n = nums(line).find(x => (x.u === 'cm' || !x.u) && x.v >= lo && x.v <= hi); return n ? n.v : null; };
  for (const l of L) {
    const n = normName(l);
    if (/^(peso|peso corporal|peso actual|masa corporal)\b/.test(n) && !/ideal|oseo|graso|magro|residual|objetivo|meta|perdid/.test(n)) { const x = nums(l).find(v => v.v >= 30 && v.v <= 250); found('weight', x ? x.v : null); }
    else if (/masa (muscular|musculo esqueletica)/.test(n)) { const p = pair(l, [10, 120]); found('muscleKg', p.kg); found('musclePct', p.pct); }
    else if (/masa (adiposa|grasa)|grasa corporal/.test(n)) { const p = pair(l, [3, 150]); found('fatKg', p.kg); found('fatPct', p.pct); }
    else if (/masa osea/.test(n)) { const p = pair(l, [1, 30]); if (p.kg != null) out.extras.push({label:'Masa ósea', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa residual/.test(n)) { const p = pair(l, [1, 40]); if (p.kg != null) out.extras.push({label:'Masa residual', value:fmt(p.kg), unit:'kg'}); }
    else if (/masa (de )?piel/.test(n)) { const p = pair(l, [0.5, 15]); if (p.kg != null) out.extras.push({label:'Masa de piel', value:fmt(p.kg), unit:'kg'}); }
    else if (/^cintura/.test(n)) found('waist', cm(l, 40, 220));
    else if (/^cadera/.test(n)) found('hip', cm(l, 50, 220));
    else if (/^muslo/.test(n)) found('thigh', cm(l, 25, 120));
    else if (/^brazo/.test(n) && !/contraid|flexionad/.test(n)) found('arm', cm(l, 15, 70));
    else if (/^brazo/.test(n)) { const v = cm(l, 15, 70); if (v != null) out.extras.push({label:'Brazo contraído', value:fmt(v), unit:'cm'}); }
    else if (/^pantorrilla/.test(n)) { const v = cm(l, 20, 80); if (v != null) out.extras.push({label:'Pantorrilla', value:fmt(v), unit:'cm'}); }
    else if (/sumatoria|suma de (6|seis|8|ocho) pliegues/.test(n)) { const x = nums(l).filter(v => v.v >= 20 && v.v <= 400).pop(); if (x) out.extras.push({label:'Sumatoria de pliegues', value:fmt(x.v), unit:'mm'}); }
    else if (/^imc\b|indice de masa corporal/.test(n)) { const x = nums(l).find(v => v.v >= 12 && v.v <= 70); if (x) out.extras.push({label:'IMC', value:fmt(x.v), unit:''}); }
  }
  const dm = text.match(/fecha[^0-9]{0,25}(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/i) || text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2})\b/);
  if (dm) { let y = +dm[3]; if (y < 100) y += 2000; const d = +dm[1], m = +dm[2]; if (m >= 1 && m <= 12 && d >= 1 && d <= 31) out.date = `${y}-${pad(m)}-${pad(d)}`; }
  return out;
}
function cleanAnthro(v) {
  const o = {date:/^\d{4}-\d{2}-\d{2}$/.test(v?.date || '') ? v.date : null, extras:[]};
  ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'].forEach(k => o[k] = num(v?.[k]));
  o.extras = (Array.isArray(v?.extras) ? v.extras : []).slice(0, 16).map(x => ({label:String(x?.label || '').trim(), value:String(x?.value ?? '').replace('.', ',').trim(), unit:String(x?.unit || '').trim()})).filter(x => x.label && x.value);
  o.notes = typeof v?.notes === 'string' ? v.notes.trim() : '';
  return o;
}
async function importAnthropometryPdf(file) {
  let cancelled = false;
  const sc = openSheet('Importar antropometría', `<div class="stack"><div class="banner info">${ic('clock')}<div id="pdfstatus">Leyendo el PDF…</div></div><button class="btn block ghost" id="pdfcancel">Cancelar</button></div>`);
  const status = t => { const el = $('#pdfstatus'); if (el) el.textContent = t; };
  $('#pdfcancel', sc).onclick = () => { cancelled = true; closeSheet(); };
  try {
    const sample = await getSample();
    const caps = sample ? await sample.limits().catch(() => null) : null;
    const maxImages = caps?.images ? Math.min(caps.images.maxCount || 3, 3) : 0;
    const {text, images} = await readPdf(file, {maxImages});
    if (cancelled) return;
    let vals = null, method = '';
    if (sample && (text.trim().length > 40 || images.length)) {
      status('Claude está leyendo el informe… puede tardar hasta un minuto.');
      try { vals = cleanAnthro(await sample.json(ANTHRO_PROMPT(text || '(sin texto: es un PDF escaneado, usá las imágenes)'), images.length ? {images} : {})); method = 'ia'; }
      catch (e) { if (cancelled) return; vals = null; }
    }
    if (!vals) {
      if (text.trim().length < 40) { closeSheet(true); toast('El PDF parece escaneado y no se pudo leer automáticamente. Cargá los valores a mano.'); openSheet('Nueva medición', measForm()); return; }
      vals = cleanAnthro(parseAnthropometryText(text)); method = 'reglas';
    }
    if (cancelled) return;
    const keys = ['weight', 'muscleKg', 'musclePct', 'fatKg', 'fatPct', 'waist', 'hip', 'thigh', 'arm'];
    const nFound = keys.filter(k => vals[k] != null).length + vals.extras.length;
    const m = {...vals, date:vals.date || todayISO(), source:'PDF: ' + file.name, notes:[`Importado de ${file.name}`, vals.notes].filter(Boolean).join('. ')};
    const dup = S.measurements.find(x => x.date === m.date);
    const banner = `<div class="banner warn" style="margin-bottom:12px">${ic('warn')}<div><b>Revisá los valores antes de guardar.</b> ${nFound ? `Se detectaron ${nFound} datos` : 'No se detectaron datos'} ${method === 'ia' ? 'con Claude' : 'con el lector automático'}. Los campos vacíos no se encontraron en el informe.${vals.date ? '' : ' <b>No se encontró la fecha:</b> completala.'}${dup ? ` <b>Ya tenés una medición del ${fmtDate(m.date)}.</b> Si es la misma, cancelá y editala.` : ''}</div></div>`;
    closeSheet(true);
    openSheet('Medición importada', measForm(m, banner));
  } catch (err) {
    if (cancelled) return;
    console.warn(err);
    closeSheet(true); toast('No se pudo leer el PDF. Probá de nuevo o cargá la medición a mano.');
  }
}

function saveManual() {
  const f = $('#manform'); const fd = new FormData(f); const name = (fd.get('name') || '').trim(); if (!name) return toast('Poné el nombre.');
  const v = {kcal:num(fd.get('kcal')), p:num(fd.get('p')) || 0, c:num(fd.get('c')) || 0, f:num(fd.get('f')) || 0}; const g = num(fd.get('grams'));
  if (v.kcal == null) return toast('Cargá al menos las calorías.');
  let entry;
  if (fd.get('basis') === '100') {
    if (!g) return toast('Indicá los gramos que comiste.');
    const per = {k:v.kcal, p:v.p, c:v.c, f:v.f};
    let foodId = null;
    if (fd.has('keep')) { const nf = {id:uid('fd'), name, ...per, unit:null, src:'propio'}; fs().foods.unshift(nf); foodId = nf.id; }
    entry = {id:uid('fe'), meal:f.dataset.meal, name, foodId, grams:g, per100:per, src:'manual', ...fromPer100(per, g)};
  } else {
    const per = g ? {k:v.kcal / g * 100, p:v.p / g * 100, c:v.c / g * 100, f:v.f / g * 100} : null;
    let foodId = null;
    if (fd.has('keep') && per) { const nf = {id:uid('fd'), name, k:r1(per.k), p:r1(per.p), c:r1(per.c), f:r1(per.f), unit:{name:'porción', g}, src:'propio'}; fs().foods.unshift(nf); foodId = nf.id; }
    entry = {id:uid('fe'), meal:f.dataset.meal, name, foodId, grams:g || null, per100:per, src:'manual', kcal:v.kcal, p:v.p, c:v.c, f:v.f};
  }
  addEntries(FD(), [entry]); persist(true); closeSheet(); rerender(); toast('Agregado');
}

  openSheet('Código de barras', `<form class="form" id="bcform" data-meal="${meal}"><p class="small muted">Escribí los números que están debajo de las barras. Se busca en Open Food Facts, una base abierta: si el producto no está, cargalo a mano copiando la tabla nutricional del envase.</p>

async function lookupBarcode() {
  const f = $('#bcform'); const code = (new FormData(f).get('code') || '').replace(/\D/g, ''); const meal = f.dataset.meal;
  if (code.length < 8) return toast('El código tiene que tener al menos 8 números.');
  const mine = fs().foods.find(x => x.barcode === code); if (mine) { closeSheet(true); return qtySheet({food:mine, meal, date:FD()}); }
  $('#bcstatus').textContent = 'Buscando…';
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,brands,nutriments,serving_quantity`);
    const d = await r.json(); const pr = d && d.product; const n = pr && pr.nutriments;
    const k = n && (n['energy-kcal_100g'] ?? (n['energy_100g'] != null ? n['energy_100g'] / 4.184 : null));
    if (!pr || k == null) { $('#bcstatus').textContent = 'No se encontró o no tiene datos nutricionales. Cargalo a mano con los valores de la etiqueta.'; return; }
    const nf = {id:uid('fd'), name:[pr.product_name_es || pr.product_name, pr.brands].filter(Boolean).join(' · ') || 'Producto ' + code, k:r1(k), p:r1(n.proteins_100g || 0), c:r1(n.carbohydrates_100g || 0), f:r1(n.fat_100g || 0),
      unit:pr.serving_quantity ? {name:'porción', g:+pr.serving_quantity} : null, barcode:code, src:'barcode'};
    fs().foods.unshift(nf); persist(true); closeSheet(true); qtySheet({food:nf, meal, date:FD()});
    toast('Encontrado. Revisá que coincida con el envase.');
  } catch (e) { $('#bcstatus').textContent = 'No se pudo conectar. Revisá internet o cargalo a mano.'; }
}

function startSession(dayKey, recoveryOf = null, date = null) {
  if (date && date !== todayISO()) { const ex = S.sessions.find(x => x.date === date && x.dayKey === dayKey && x.status === 'in_progress'); if (ex) { go('#/sesion/' + ex.id); return; } createSession(dayKey, null, null, date); return; }
  const ip = inProgressSession();
  if (ip) {
    if (ip.dayKey === dayKey && !!ip.recoveryOf === !!recoveryOf) { go('#/sesion/' + ip.id); return; }
    confirmSheet('Hay un entrenamiento en curso', 'Tenés otro entrenamiento sin finalizar. Abrilo para finalizarlo o descartarlo antes de empezar uno nuevo.', 'Abrir el que está en curso').then(ok => { if (ok) go('#/sesion/' + ip.id); });
    return;
  }
  openCheckin(dayKey, recoveryOf);
}
function createSession(dayKey, recoveryOf, adjust, date) {
  const s = {id:uid('s'), blockId:S.activeBlockId, dayKey, type:'gym', date:date || todayISO(), status:'in_progress', startedAt:Date.now(), finishedAt:null, entries:{}, notes:''};
  if (recoveryOf) s.recoveryOf = recoveryOf;
  if (adjust) s.adjust = adjust;
  if (S.dayRest) delete S.dayRest[s.date];
  S.sessions.push(s); persist(true); go('#/sesion/' + s.id);
}
const curSession = () => { const h = CUR.match(/^sesion\/(.+)/); return h ? S.sessions.find(s => s.id === h[1]) : null; };
function ensureEntry(s, ex) {
  if (!s.entries[ex.id]) s.entries[ex.id] = {exId:ex.id, name:ex.name, target:{sets:ex.sets, repMin:ex.repMin, repMax:ex.repMax, unit:ex.unit, side:ex.side, rir:ex.rir}, weight:null, reps:[], rir:null, notes:'', saved:false, savedAt:null};
  return s.entries[ex.id];
}
function exOfSession(s, exId) { const blk = blockById(s.blockId) || activeBlock(); return dayOf(blk, s.dayKey).exercises.find(e => e.id === exId); }
function entryHasData(e) { return e && (e.weight != null || (e.reps || []).some(r => r != null && r !== '') || e.rir != null || e.notes); }

async function finishSession(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const blk = blockById(s.blockId); const day = dayOf(blk, s.dayKey);
  const unsaved = day.exercises.filter(ex => !s.entries[ex.id]?.saved && entryHasData(s.entries[ex.id]));
  const saved = day.exercises.filter(ex => s.entries[ex.id]?.saved).length;
  let msg = `Guardaste ${saved} de ${day.exercises.length} ejercicios.`;
  if (unsaved.length) msg += ` Hay ${unsaved.length} con datos cargados sin guardar (${unsaved.map(e => esc(e.name)).join(', ')}): se van a guardar tal como están.`;
  if (!saved && !unsaved.length) msg = 'No guardaste ningún ejercicio. ¿Finalizar igual?';
  if (!(await confirmSheet('Finalizar entrenamiento', msg, 'Finalizar'))) return;
  unsaved.forEach(ex => { const e = s.entries[ex.id]; e.saved = true; e.savedAt = Date.now(); });
  Object.keys(s.entries).forEach(k => { if (!s.entries[k].saved) delete s.entries[k]; });
  s.status = 'done'; s.finishedAt = Date.now(); stopRest(true); await persist(true);
  go('#/entrenar'); setTimeout(() => showFinishSummary(s.id), REDUCE() ? 0 : 320);
}

function showFinishSummary(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const blk = blockById(s.blockId) || activeBlock(); const day = dayOf(blk, s.dayKey);
  const ents = day.exercises.map(ex => [ex, s.entries[ex.id]]).filter(([, e]) => e && e.saved);
  const total = day.exercises.filter(ex => !ex.optional).length || day.exercises.length; const done = ents.length;
  let sets = 0, reps = 0, vol = 0; const better = []; let firsts = 0;
  ents.forEach(([ex, e]) => {
    const rs = (e.reps || []).map(num).filter(r => r != null); sets += rs.length; const sr = rs.reduce((a, b) => a + b, 0); reps += sr;
    if (e.weight != null) vol += e.weight * sr;
    const prev = entriesFor((x, ss) => x.exId === ex.id && ss.id !== s.id && ss.date <= s.date).pop();
    if (!prev) { firsts++; return; }
    const pr = (prev.reps || []).map(num).filter(r => r != null).reduce((a, b) => a + b, 0);
    if (e.weight != null && prev.weight != null && e.weight > prev.weight) better.push(`${ex.name}: subiste de ${fmtN(prev.weight)} a ${fmtN(e.weight)} kg`);
    else if ((e.weight ?? 0) === (prev.weight ?? 0) && sr > pr) better.push(`${ex.name}: ${sr - pr} repeticiones más con el mismo peso`);
  });
  const ups = ents.filter(([ex, e]) => suggest(ex, e)?.lvl === 'up').length;
  const pct = Math.min(1, done / total); const R = 70, C = 2 * Math.PI * R;
  const stat = (l, v, u, i) => `<div class="metric" style="animation-delay:${180 + i * 70}ms"><div class="l">${l}</div><div class="v"><span data-count="${Math.round(v)}">${REDUCE() ? Math.round(v).toLocaleString('es-AR') : 0}</span>${u ? `<small>${u}</small>` : ''}</div></div>`;
  const sc = openSheet('Entrenamiento terminado', `<div class="done-hero">
      <div class="ring-wrap" style="--c:${day.color}"><svg class="ring" viewBox="0 0 164 164" aria-hidden="true"><circle class="trk" cx="82" cy="82" r="${R}" fill="none" stroke-width="12"/>
        <circle class="val" cx="82" cy="82" r="${R}" fill="none" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="${REDUCE() ? C * (1 - pct) : C}" transform="rotate(-90 82 82)" data-off="${C * (1 - pct)}"/></svg>
        <div class="ring-in"><b>${done}/${total}</b><span>ejercicios</span></div></div>
      <div class="done-title">${done >= total ? '¡Sesión completa!' : 'Sesión registrada'}</div>

async function exportBackup() {
  const payload = {app:'mi-rutina', schema:1, profile:PID, exportedAt:new Date().toISOString(), data:S};
  const json = JSON.stringify(payload, null, 2);
  const name = `mi-rutina-${PID}-respaldo-${todayISO()}.json`;

  const markDone = () => { S.lastBackupAt = Date.now(); persist(true); rerender(); toast('Respaldo exportado'); };
  // Página publicada en claude.ai: la descarga pasa por la capacidad "downloads"
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;

    try { await dl.save({filename:name, data:json}); markDone(); }
    catch (err) { if (err && err.code !== 'declined') toast('No se pudo exportar el respaldo en esta vista.'); }
    return;
  }
  // iPhone: la hoja de compartir permite guardar en Archivos / iCloud
  if (file && navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    navigator.share({files:[file], title:'Respaldo Mi rutina'}).then(markDone).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markDone();
}

      o.extras = $$('#extras .extra').map(r => ({label:$('[data-x="label"]', r).value.trim(), value:$('[data-x="value"]', r).value.trim(), unit:$('[data-x="unit"]', r).value.trim()})).filter(x => x.label && x.value);
      if (!o.date) { toast('Indicá la fecha.'); break; }
      if (o.weight == null && o.muscleKg == null && o.fatKg == null && !o.extras.length && [o.waist, o.hip, o.thigh, o.arm].every(v => v == null)) { toast('Cargá al menos un dato.'); break; }
      if (id) Object.assign(S.measurements.find(m => m.id === id), o); else S.measurements.push({id:uid('m'), ...o});
      await persist(true); closeSheet(); rerender(); toast(id ? 'Medición actualizada' : 'Medición agregada'); break; }
    case 'meas-del': if (await confirmSheet('Eliminar medición', 'Se borra solo esta medición. Las demás quedan guardadas.', 'Eliminar', true)) { S.measurements = S.measurements.filter(m => m.id !== d.id); await persist(true); rerender(); } break;
    // Rutina
    case 'routine-tab': UI.routineTab = d.v; rerender(); break;
    case 'routine-block': UI.routineBlock = d.v; UI.editing = false; rerender(); break;
    case 'toggle-edit': UI.editing = !UI.editing; rerender(); break;
    case 'ex-new': openSheet('Nuevo ejercicio', exForm(d.day)); break;
    case 'ex-edit': openSheet('Editar ejercicio', exForm(d.day, dayOf(activeBlock(), d.day).exercises.find(x => x.id === d.ex))); break;
    case 'ex-save': { const f = $('#exform'); const r = readExForm(f); if (typeof r === 'string') { toast(r); break; }
      const forb = forbiddenFor(r.name + ' ' + r.sub);
      if (forb) { openSheet('Ejercicio no permitido', `<div class="banner warn">${ic('warn')}<div><b>Restricción personal:</b> ${esc(forb)}<br>Tampoco se agregan bisagras de cadera como sustituto (buenos días, pull-through, etc.). El ejercicio no se guardó.</div></div><button class="btn block" style="margin-top:14px" data-act="sheet-close">Entendido</button>`); break; }
      const day = dayOf(activeBlock(), f.dataset.day);
      if (f.dataset.ex) Object.assign(day.exercises.find(x => x.id === f.dataset.ex), r);
      else day.exercises.push(E({...r, id:uid('ex')}));
      await persist(true); closeSheet(); rerender(); toast('Rutina actualizada'); break; }
    case 'ex-move': { const day = dayOf(activeBlock(), d.day); const i = day.exercises.findIndex(x => x.id === d.ex); const j = i + (+d.dir);
      if (j < 0 || j >= day.exercises.length) break; [day.exercises[i], day.exercises[j]] = [day.exercises[j], day.exercises[i]]; persist(); rerender(); break; }
    case 'ex-del': { const day = dayOf(activeBlock(), d.day); const ex = day.exercises.find(x => x.id === d.ex);
      if (await confirmSheet('Quitar ejercicio', `Se quita <b>${esc(ex.name)}</b> de la rutina del ${esc(day.name.toLowerCase())}. Sus registros anteriores quedan en el historial.`, 'Quitar', true)) { day.exercises = day.exercises.filter(x => x.id !== d.ex); await persist(true); rerender(); } break; }
    case 'day-edit': { const day = dayOf(activeBlock(), d.day);
      openSheet('Editar ' + day.name.toLowerCase(), `<form class="form" id="dayform" data-day="${day.key}"><div class="field"><label for="d-t">Enfoque del día</label><input id="d-t" name="title" value="${esc(day.title)}"></div><div class="field"><label for="d-i">Indicación general (opcional)</label><textarea id="d-i" name="intro">${esc(day.intro)}</textarea></div><button type="button" class="btn block" data-act="day-save">${ic('check')} Guardar</button></form>`); break; }
    case 'day-save': { const f = $('#dayform'); const day = dayOf(activeBlock(), f.dataset.day); const fd = new FormData(f); day.title = fd.get('title').trim() || day.title; day.intro = fd.get('intro').trim(); await persist(true); closeSheet(); rerender(); break; }
    case 'run-plan-edit': { const r = activeBlock().running; const ta = (k, l) => `<div class="field"><label for="rp-${k}">${l}</label><textarea id="rp-${k}" name="${k}" rows="3">${esc(r[k].join('\n'))}</textarea></div>`;
      const T = r.titles || ['Entrada en calor', 'Carrera', 'Opcional al final'];
      openSheet('Indicaciones de ' + PROFILE.cardioLabel.toLowerCase(), `<form class="form" id="rpform">${ta('warmup', T[0])}${ta('main', T[1])}${ta('optional', T[2])}${ta('notes', 'Salvedades')}<span class="hint">Una indicación por línea.</span><button type="button" class="btn block" data-act="run-plan-save">${ic('check')} Guardar</button></form>`); break; }
    case 'run-plan-save': { const fd = new FormData($('#rpform')); const r = activeBlock().running; ['warmup', 'main', 'optional', 'notes'].forEach(k => r[k] = lines(fd.get(k))); await persist(true); closeSheet(); rerender(); break; }
    case 'block-edit': { const b = activeBlock();
      openSheet('Datos del bloque', `<form class="form" id="blockform"><div class="field"><label for="b-n">Nombre</label><input id="b-n" name="name" value="${esc(b.name)}"></div><div class="grid2"><div class="field"><label for="b-w">Duración (semanas)</label><input id="b-w" name="weeks" inputmode="numeric" value="${b.weeks}"></div><div class="field"><label for="b-s">Inicio</label><input id="b-s" type="date" name="startDate" value="${b.startDate}"></div></div><span class="hint">La semana actual se calcula desde la fecha de inicio.</span><button type="button" class="btn block" data-act="block-save">${ic('check')} Guardar</button></form>`); break; }
    case 'block-save': { const fd = new FormData($('#blockform')); const b = activeBlock(); b.name = fd.get('name').trim() || b.name; b.weeks = Math.max(1, parseInt(fd.get('weeks')) || b.weeks); b.startDate = fd.get('startDate') || b.startDate; await persist(true); closeSheet(); rerender(); break; }
    case 'block-new': { const b = activeBlock(); const n = S.blocks.length + 1;
      openSheet('Crear nuevo bloque', `<form class="form" id="newblock"><p style="font-size:15px">${esc(b.name)} se cierra y queda guardado con todo su historial, consultable desde Rutina y Progreso.</p>
        <div class="field"><label for="nb-n">Nombre</label><input id="nb-n" name="name" value="Bloque ${n}"></div>
        <div class="grid2"><div class="field"><label for="nb-w">Duración (semanas)</label><input id="nb-w" name="weeks" inputmode="numeric" value="6"></div><div class="field"><label for="nb-s">Inicio</label><input id="nb-s" type="date" name="startDate" value="${mondayOf(todayISO())}"></div></div>
        <label class="checkrow"><input type="checkbox" name="copy" checked> Empezar con una copia de la rutina actual para editarla</label>
        <button type="button" class="btn block" data-act="block-create">${ic('plus')} Crear bloque</button></form>`); break; }
    case 'block-create': { const fd = new FormData($('#newblock')); const old = activeBlock();
      if (inProgressSession()) { toast('Finalizá o descartá el entrenamiento en curso primero.'); break; }
      const days = fd.has('copy') ? clone(old.days) : old.days.map(dd => ({...clone(dd), exercises:[]}));
      const nb = {id:uid('b'), name:fd.get('name').trim() || `Bloque ${S.blocks.length + 1}`, weeks:Math.max(1, parseInt(fd.get('weeks')) || 6), startDate:fd.get('startDate') || todayISO(), endDate:null, status:'active', days, running:clone(old.running)};
      old.status = 'closed'; old.endDate = todayISO(); S.blocks.push(nb); S.activeBlockId = nb.id; UI.routineBlock = nb.id; UI.editing = true; UI.routineTab = 'dias';
      await persist(true); closeSheet(); rerender(); toast(`${nb.name} creado. Editá lo que quieras cambiar.`); break; }
    // Ajustes
    case 'export': exportBackup(); break;
    case 'persist': if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); toast(ok ? 'Almacenamiento persistente activado' : 'El navegador no lo concedió. Seguí exportando respaldos.'); } else toast('Este navegador no ofrece esa opción.'); break;
    case 'reset': if (await confirmSheet('Borrar todos los datos', `Se borran entrenamientos, mediciones, bloques y cambios de rutina del perfil de ${esc(PROFILE.name)}. <b>No se puede deshacer.</b> Exportá un respaldo antes si lo necesitás.`, 'Borrar todo', true)) { S = defaultState(); await persist(true); UI.routineBlock = null; toast('Datos borrados'); go('#/inicio'); } break;
  }
});

// Entrada de datos en la sesión: se guarda como borrador al escribir (no se pierde si se bloquea el celular)
document.addEventListener('input', e => {
  if (!S) return;
  if (e.target.id === 'foodsearch') { const box = $('#foodresults'); if (box) box.innerHTML = foodResultsHTML(e.target.value, e.target.dataset.meal); return; }
  if (e.target.id === 'foodqty') { updateQtyPreview(); return; }
  const t = e.target; const s = curSession(); if (!s) return;
  if (t.dataset.cfield) { s.cardio = s.cardio || {}; s.cardio[t.dataset.cfield] = t.dataset.cfield === 'minutes' ? num(t.value) : t.value; persist(); const el = $('#kcalest'); if (el) el.innerHTML = kcalEstHTML(s); return; }
  if (t.dataset.sfield) { if (t.dataset.sfield === 'date' && !t.value) return;
    s[t.dataset.sfield] = ['durationMin', 'kcalManual'].includes(t.dataset.sfield) ? num(t.value) : t.value; persist();
    if (['durationMin', 'kcalManual', 'date'].includes(t.dataset.sfield)) { const el = $('#kcalest'); if (el) el.innerHTML = kcalEstHTML(s); }
    return; }
  const log = t.closest('.log'); if (!log || !t.dataset.efield) return;
  const ex = exOfSession(s, log.dataset.ex); const en = ensureEntry(s, ex);
  if (t.dataset.efield === 'weight') en.weight = num(t.value);
  else if (t.dataset.efield === 'rep') { const reps = en.reps || []; reps[+t.dataset.i] = t.value === '' ? null : parseInt(t.value); en.reps = Array.from({length:ex.sets}, (_, i) => Number.isFinite(reps[i]) ? reps[i] : null); }
  else if (t.dataset.efield === 'notes') en.notes = t.value;
  persist();
});
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('change', e => {
  if (S && e.target.dataset.efield === 'rep' && e.target.value && S.settings.autoRest !== false) {
    const s = curSession(); const log = e.target.closest('.log'); const ex = s && log && exOfSession(s, log.dataset.ex);
    if (ex) { const blk = blockById(s.blockId) || activeBlock(); startRest(restFor(ex), ex.name, dayOf(blk, s.dayKey).color); }
  }
  if (e.target.id === 'importfile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'planfile' && e.target.files[0]) { importFoodPlan(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'pdffile' && e.target.files[0]) { importAnthropometryPdf(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S) Store.save(S).catch(() => {}); });
window.addEventListener('popstate', () => { try { CUR = location.hash.replace(/^#\/?/, '') || 'inicio'; } catch (e) {} closeSheet(true); route(); });

/* ---------- 9. Arranque ---------- */
function showChooser() { $('#nav').classList.add('hide'); closeSheet(true); $('#app').innerHTML = vChooser(); window.scrollTo(0, 0); }
async function activateProfile(pid, keepRoute = false) {
  if (!PROFILES[pid]) return showChooser();
  setProfile(pid);
  const data = await Store.load();
  const migrated = !!(data && data.__migrated);
  S = normalize(data || defaultState());
  await persist(true); // guarda (o migra) bajo la clave del perfil, incluidas actualizaciones de rutina
  go(keepRoute ? CUR : '#/inicio');
  if (migrated) toast('Tus datos anteriores quedaron en este perfil.');
}
(async function boot() {
  await Store.init();
  let pid = null; try { pid = localStorage.getItem('mi-rutina-perfil'); } catch (e) {}
  if (pid && PROFILES[pid]) await activateProfile(pid, true); else showChooser();
})();
</script>
