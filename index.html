<title>Mi rutina</title>
<style>
/* ============ Tokens ============ */
:root{
  --bg:#F2F1F4; --surface:#FFFFFF; --surface2:#F7F6F9; --ink:#1E1A22; --mut:#6E6873; --line:#E4E1E8;
  --primary:#7A2E4F; --primary-ink:#FFFFFF;
  --mar:#9C3D5A; --jue:#3D4C7D; --sab:#6A4277; --run:#2E7366; --box:#8A8290;
  --warn-bg:#FFF1DC; --warn-ink:#6E420A; --warn-line:#E09A3E;
  --ok:#2E7366; --down:#B5513A; --hold:#6E6873;
  --edit:#2B2530; --track:#E7E5EB; --ok-bg:#E3F1EE; --ok-ink:#1E5249; --hold-bg:#EEEDF1; --hold-ink:#3E3843; --down-bg:#FBE9E6; --down-ink:#7D3020; --body2:#3E3843;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16131A;--surface:#211D26;--surface2:#2B2631;--ink:#F1EEF4;--mut:#A9A2AE;--line:#3A343F;--primary:#B9567F;--warn-bg:#3A2A14;--warn-ink:#F2D2A0;--edit:#3A3341;--track:#3A343F;--ok-bg:#1C3530;--ok-ink:#BFE3DA;--hold-bg:#2E2934;--hold-ink:#DCD6E0;--down-bg:#3D2320;--down-ink:#F2C2B8;--body2:#D6D0DA;--box:#A39BA8;color-scheme:dark}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-size:16px;line-height:1.4;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ Layout ============ */
.app{max-width:720px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.topbar h1{font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.topbar .sub{color:var(--mut);font-size:14px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:2px}
.section-title{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title small{font-size:13px;color:var(--mut);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--mut)}
.small{font-size:13px}
.hide{display:none!important}

/* ============ Bottom nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mut);font-size:10px;font-weight:600;min-width:0;white-space:nowrap}
.nav a svg{width:21px!important;height:21px!important}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--primary)}

/* ============ Surfaces ============ */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.card.flat{border:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.pill.c{background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.dash{background:transparent;border:1.5px dashed var(--c);color:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--primary);color:var(--primary-ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:color-mix(in srgb,var(--c,var(--primary)) 12%,var(--surface));color:var(--c,var(--primary))}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--down-bg);color:var(--down-ink)}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{color:var(--primary);font-weight:650;font-size:14.5px;padding:6px 2px;display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--mut);white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,26,34,.12)}

/* ============ Home ============ */
.hero{border-radius:22px;padding:18px;background:var(--c,var(--primary));color:#fff;position:relative;overflow:hidden}
.hero .k{font-size:13.5px;opacity:.85;font-weight:600}
.hero .t{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .d{font-size:15px;opacity:.92;margin-top:4px}
.hero .btn{background:#fff;color:var(--c,var(--primary));margin-top:14px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{background:rgba(255,255,255,.17);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 12px}
.metric .l{font-size:12.5px;color:var(--mut);font-weight:600}
.metric .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.metric .v small{font-size:13px;font-weight:600;color:var(--mut);margin-left:2px}
.metric .dl{font-size:12px;font-weight:650;margin-top:3px}
.dl.good{color:var(--ok)} .dl.bad{color:var(--down)} .dl.neu{color:var(--mut)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{min-width:0;font:inherit;color:inherit;cursor:pointer;border-radius:12px;padding:8px 1px 9px;text-align:center;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;text-decoration:none}
.wd b{font-size:13px}
.wd .act{font-size:9px;line-height:1.15;color:var(--mut);font-weight:600;letter-spacing:-.02em;hyphens:auto;overflow-wrap:anywhere}
@media (min-width:400px){.wd .act{font-size:10.5px}}
.wd .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--mut)}
.wd .dot svg{width:14px;height:14px}
.wd.gym{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 25%,var(--surface))}
.wd.gym .act{color:var(--c)}
.wd.today{outline:2.5px solid var(--ink);outline-offset:1px}
.wd.done .dot{background:var(--c,var(--primary));color:#fff}
.wd.missed .dot{background:var(--down);color:#fff}
.wd.missed{border-color:color-mix(in srgb,var(--down) 35%,var(--surface))}
.blockbar{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.38}
.banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line)}
.banner.info{background:color-mix(in srgb,var(--c,var(--primary)) 9%,var(--surface));color:var(--ink)}
.banner.info svg{color:var(--c,var(--primary))}
.banner.edit{background:var(--edit);color:#fff}

/* ============ Train hub ============ */
.daybtn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:left;width:100%}
.daybtn .sw{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:15px}
.daybtn .sw svg{width:24px;height:24px}
.daybtn .tx{flex:1;min-width:0}
.daybtn .tx b{display:block;font-size:18px;letter-spacing:-.01em}
.daybtn .tx span{display:block;font-size:14px;color:var(--mut);margin-top:1px}
.daybtn .chev{color:var(--mut)}
.daybtn.today{border:2px solid var(--c)}
.sat-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ Exercise cards ============ */
.ex{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;position:relative}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ex-in{padding:14px 14px 14px 18px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-n{font-size:18.5px;font-weight:780;letter-spacing:-.01em;line-height:1.2}
.ex-s{font-size:14px;color:var(--mut);margin-top:1px}
.ex-pos{font-size:12.5px;font-weight:750;color:var(--c);margin-bottom:2px}
.ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px;margin-top:11px}
.fact{background:var(--surface2);border-radius:10px;padding:6px 10px;min-width:0}
.fact .fl{font-size:11.5px;color:var(--mut);font-weight:600}
.fact .fv{font-size:16px;font-weight:750;line-height:1.2}
.fact.w{grid-column:1/-1}
.fact.w .fv{font-size:15px;font-weight:600}
.lastline{margin-top:10px;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lastline b{font-weight:750}
.lastline .muted{font-size:13px}
.tip{margin-top:9px;font-size:14.5px;color:var(--body2);display:flex;gap:7px;line-height:1.38}
.tip svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;color:var(--c)}
.warnline{margin-top:9px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line);border-radius:9px;padding:8px 10px;line-height:1.36;display:flex;gap:7px}
.warnline svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:#C77812}
details.acc{margin-top:10px;border-top:1px solid var(--line)}
details.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0 2px;font-weight:700;font-size:15px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{transition:transform .15s;color:var(--mut)}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc summary .sl{display:flex;align-items:center;gap:7px}
details.acc summary .sl svg{width:18px;height:18px}
.acc-body{padding:8px 0 2px;display:flex;flex-direction:column;gap:8px}
.acc-body ul{padding-left:18px;font-size:14.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.acc-body h5{font-size:13px;color:var(--mut);font-weight:700}
.note{font-size:14px;background:var(--surface2);border-radius:9px;padding:8px 10px;line-height:1.38;display:flex;gap:7px}
.note svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--c)}
.machnote{font-size:13.5px;color:var(--mut);display:flex;gap:6px;align-items:flex-start}
.machnote svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.grouphead{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-weight:750;font-size:15px;color:var(--c)}
.grouphead::after{content:"";flex:1;height:2px;background:var(--c);opacity:.22;border-radius:2px}
.ex.optional{border-style:dashed}

/* ============ Session ============ */
.sess-head{border-radius:22px;padding:16px 18px;background:var(--c);color:#fff;margin-bottom:12px}
.sess-head .t{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sess-head .d{font-size:14.5px;opacity:.9;margin-top:3px}
.sess-head .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.sess-head .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.sess-head .row{margin-top:10px;justify-content:space-between}
.sess-head input[type=date]{background:rgba(255,255,255,.17);border:none;border-radius:10px;color:#fff;padding:7px 10px;font-size:16px;font-weight:600;color-scheme:dark}
.log{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.lbl{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.wrow{display:flex;gap:8px;align-items:stretch}
.numin{flex:1;display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:0 12px;min-height:54px}
.numin input{width:100%;border:none;background:none;font-size:22px;font-weight:800;outline:none;padding:0}
.numin span{font-weight:700;color:var(--mut)}
.numin:focus-within{border-color:var(--c);background:var(--surface)}
.sets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:7px}
.set{background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:6px 4px 4px;text-align:center}
.set:focus-within{border-color:var(--c);background:var(--surface)}
.set .sn{font-size:11.5px;font-weight:700;color:var(--mut)}
.set input{width:100%;border:none;background:none;text-align:center;font-size:26px;font-weight:800;outline:none;padding:0 0 2px}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rir button{min-height:46px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:17px}
.rir button.on{background:var(--c);border-color:var(--c);color:#fff}
textarea,.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
textarea{min-height:70px;resize:vertical;line-height:1.4}
textarea:focus,.field input:focus,.field select:focus{border-color:var(--c,var(--primary));background:var(--surface)}
.sugg{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.38;display:flex;gap:8px}
.sugg svg{width:19px;height:19px;flex-shrink:0;margin-top:1px}
.sugg.up{background:var(--ok-bg);color:var(--ok-ink)}
.sugg.hold{background:var(--hold-bg);color:var(--hold-ink)}
.sugg.down{background:var(--down-bg);color:var(--down-ink)}
.sugg small{display:block;opacity:.75;font-size:12.5px;margin-top:2px}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--primary)) 11%,var(--surface));color:var(--ink)}
.saved b{font-size:15px}
.saved .muted{color:var(--mut)}

.tick{width:26px;height:26px;border-radius:50%;background:var(--c,var(--primary));color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tick svg{width:16px;height:16px}
.sticky-finish{margin-top:16px}

/* ============ Charts / lists ============ */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--track);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .lv{font-size:12.5px;font-weight:800}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:15px;text-align:left;width:100%;text-decoration:none}
.listrow .mid{flex:1;min-width:0}
.listrow .mid b{display:block;font-size:16px;line-height:1.25}
.listrow .mid span{display:block;font-size:13.5px;color:var(--mut);margin-top:1px}
.listrow .bar{width:5px;align-self:stretch;border-radius:5px;background:var(--c);flex-shrink:0}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface2);border-radius:13px;padding:11px 13px}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow .top b{font-size:15px}
.hrow .reps{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:.01em}
.hrow .reps small{font-size:13px;font-weight:650;color:var(--mut);margin-left:6px}
.hrow .n{font-size:13.5px;color:var(--mut);margin-top:4px}
.trend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:15px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:6px 10px}
.kv span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kv b{font-size:15.5px}

/* ============ Sheet / modal ============ */
.scrim{position:fixed;inset:0;background:rgba(30,26,34,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.scrim.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-h h3{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sheet-b{padding:4px 16px calc(var(--safe-b) + 20px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:700;color:var(--mut)}
.field .hint{font-size:12.5px;color:var(--mut)}
.checkrow{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.checkrow input{width:22px;height:22px;accent-color:var(--primary)}
.form{display:flex;flex-direction:column;gap:12px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-weight:650;font-size:14.5px;z-index:80;opacity:0;transition:all .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ============ Routine / edit ============ */
.blockchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.blockchips::-webkit-scrollbar{display:none}
.blockchips button{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px}
.blockchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.blockchips button small{font-weight:600;opacity:.7;margin-left:4px}
.editing .ex{border:1.5px dashed #8A7F8E}
.edit-tools{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.edit-tools .btn{flex:1}
.dayhead{border-radius:18px;padding:14px 16px;background:var(--c);color:#fff;margin-top:16px}
.dayhead b{font-size:21px;letter-spacing:-.01em}
.dayhead span{display:block;font-size:14.5px;opacity:.92}
.dayhead p{font-size:13.5px;opacity:.88;margin-top:6px}
.guide h4{font-size:16.5px;margin-bottom:6px}
.guide p,.guide li{font-size:15px;line-height:1.48}
.guide ul,.guide ol{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.progrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--c)}
.progrow b{font-size:17px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--c);color:#fff}
.step.later .n{background:var(--surface);color:var(--mut);border:2px dashed #B8B0BC}
.step b{display:block;font-size:15.5px;margin-top:5px}
.step span{display:block;font-size:14px;color:var(--mut)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.c,:root:not([data-theme="light"]) .ex-pos,:root:not([data-theme="light"]) .grouphead,:root:not([data-theme="light"]) .wd.gym .act,:root:not([data-theme="light"]) .pill.dash,:root:not([data-theme="light"]) .btn.soft,:root:not([data-theme="light"]) .tip svg,:root:not([data-theme="light"]) .th,:root:not([data-theme="light"]) .exnav button.cur:not(.ok){color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}
:root:not([data-theme="light"]) .exnav button.cur:not(.ok){border-color:color-mix(in srgb,var(--c) 60%,#fff)}
:root:not([data-theme="light"]) .ring .val{stroke:color-mix(in srgb,var(--c) 70%,#fff)}}
:root[data-theme="dark"] .pill.c,:root[data-theme="dark"] .ex-pos,:root[data-theme="dark"] .grouphead,:root[data-theme="dark"] .wd.gym .act,:root[data-theme="dark"] .pill.dash,:root[data-theme="dark"] .btn.soft{color:color-mix(in srgb,var(--c,var(--primary)) 50%,#fff)}

/* ============ Movimiento (responde a lo que tocás) ============ */
:root{--e-out:cubic-bezier(.2,.8,.2,1);--e-spring:cubic-bezier(.34,1.56,.64,1);--d1:140ms;--d2:240ms;--d3:420ms}
.listrow,.daybtn,.wd,.iconbtn,.rir button,.seg button,.blockchips button,.btn,.exnav button{transition:transform var(--d1) var(--e-out),background-color var(--d2) var(--e-out),border-color var(--d2) var(--e-out),color var(--d2) var(--e-out),box-shadow var(--d2) var(--e-out)}
.listrow:active,.daybtn:active,.wd:active,.iconbtn:active,.seg button:active,.blockchips button:active,.exnav button:active{transform:scale(.96)}
.rir button:active{transform:scale(.9)}
.rir button.on{animation:pop var(--d2) var(--e-spring)}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.set,.numin{transition:border-color var(--d2) var(--e-out),background-color var(--d2) var(--e-out),box-shadow var(--d2) var(--e-out)}
.set:focus-within,.numin:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--primary)) 16%,transparent)}
details.acc[open] > .acc-body{animation:reveal var(--d2) var(--e-out)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
details.acc summary .chev{transition:transform var(--d2) var(--e-out)}
/* barra de navegación */
.nav a .ni{display:flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:999px;transition:background-color var(--d2) var(--e-out),transform var(--d2) var(--e-spring)}
.nav a.on .ni{background:color-mix(in srgb,var(--primary) 15%,transparent)}
.nav a:active .ni{transform:scale(.88)}
.nav a span:last-child{transition:color var(--d2) var(--e-out)}
/* hojas */
.scrim{transition:opacity var(--d2) var(--e-out)}
.sheet{transition:transform 360ms var(--e-out);box-shadow:0 -10px 40px rgba(30,26,34,.18)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;flex:none}
@media (min-width:760px){.sheet::before{display:none}}
/* aviso */
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:999px;font-size:14px;max-width:min(90vw,420px);text-align:left;transform:translateX(-50%) translateY(18px) scale(.96);transition:opacity var(--d2) var(--e-out),transform 380ms var(--e-spring);box-shadow:0 8px 28px rgba(30,26,34,.22)}
.toast.on{transform:translateX(-50%) translateY(0) scale(1)}
.toast .ti{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--primary);color:#fff}
.toast .ti.info{background:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.toast .ti svg{width:14px;height:14px}
/* ejercicio recién guardado */
.ex.just-saved .tick{animation:tickpop 560ms var(--e-spring)}
@keyframes tickpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.ex.just-saved .saved{animation:flash 800ms var(--e-out)}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--primary)) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.ex.just-saved::before{animation:grow 500ms var(--e-out)}
@keyframes grow{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1)}}
.sess-head .bar i,.progress i{transition:width 650ms var(--e-out)}
/* navegador de ejercicios de la sesión */
.exnav{position:sticky;top:0;z-index:20;margin:0 -16px 10px;padding:calc(var(--safe-t) + 8px) 16px 8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;min-width:40px;height:40px;padding:0 10px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:750;font-size:14px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:3px}
.exnav button svg{width:15px;height:15px}
.exnav button.ok{background:var(--c);border-color:var(--c);color:#fff}
.exnav button.cur{border-color:var(--c);color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.exnav button.ok.cur{color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.ex{scroll-margin-top:calc(var(--safe-t) + 68px)}
/* semanas del bloque */
.weeks{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;margin-top:12px}
.weeks i{height:8px;border-radius:5px;background:var(--track)}
.weeks i.done{background:var(--primary)}
.weeks i.now{background:linear-gradient(90deg,var(--primary) 50%,var(--track) 50%)}
/* cierre del entrenamiento: el momento importante */
.done-hero{text-align:center;padding:4px 0 2px}
.ring{width:164px;height:164px;display:block;margin:0 auto}
.ring .trk{stroke:var(--track)}
.ring .val{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1200ms var(--e-out)}
.ring-wrap{position:relative;width:164px;margin:0 auto}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-in b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring-in span{font-size:13px;color:var(--mut);font-weight:600;margin-top:4px}
.done-title{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:12px}
.done-sub{color:var(--mut);font-size:15px;margin-top:2px}
.done-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.done-stats .metric{animation:rise 420ms var(--e-out) both}
.done-row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:var(--ok-bg);color:var(--ok-ink);font-size:14.5px;line-height:1.35;animation:rise 420ms var(--e-out) both}
.done-row svg{width:18px;height:18px;flex:none;margin-top:1px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* transición entre pantallas */
.nav{view-transition-name:nav}
::view-transition-old(root){animation:vt-out 150ms var(--e-out) both}
::view-transition-new(root){animation:vt-in 280ms var(--e-out) both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none!important}.ring .val{transition:none!important}}

/* ============ Temporizador de descanso ============ */
#rest{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:45;transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;border-radius:22px;padding:8px 8px 8px 10px;width:min(calc(100vw - 24px),420px);box-shadow:0 10px 30px rgba(30,26,34,.28);transition:transform 380ms var(--e-spring),opacity var(--d2) var(--e-out)}
#rest.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
body:has(#rest.on) .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 84px)}
#rest.done{animation:restdone 600ms var(--e-spring)}
@keyframes restdone{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
#rest .rest-ring{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center}
#rest .rest-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
#rest .rest-tx b{font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#rest .rest-tx span{font-size:12.5px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest button{min-width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center}

.restbtn{display:inline-flex;align-items:center;gap:4px;font-weight:650;font-size:13.5px;color:var(--c);padding:2px 0}

/* ---------- 4. Almacenamiento ---------- */
const Store = {
  mode:'memory', db:null, DB:'mi-rutina', OS:'kv', KEY:'state', LS:'mi-rutina-state',
  async init() {
    try {
      if (!window.indexedDB) throw new Error('sin indexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(this.DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(this.OS);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      this.mode = 'indexeddb';
    } catch (e) {
      try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
    }
  },
  async readKey(key, ls) {
    let data = null;
    if (this.mode === 'indexeddb') {
      data = await new Promise(res => { try {
        const g = this.db.transaction(this.OS, 'readonly').objectStore(this.OS).get(key);
        g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
      } catch (e) { res(null); } });
    }
    if (!data) { try { const t = localStorage.getItem(ls); if (t) data = JSON.parse(t); } catch (e) {} }
    return data;
  },
  async load() {
    let data = await this.readKey(this.KEY, this.LS);
    // Datos guardados antes de que existieran los perfiles: pertenecen a Guada
    if (!data && this.legacy) { data = await this.readKey('state', 'mi-rutina-state'); if (data) data.__migrated = true; }
    return data;
  },
  async save(obj) {
    const json = JSON.stringify(obj);
    if (this.mode === 'indexeddb') {
      await new Promise((res, rej) => {
        const tx = this.db.transaction(this.OS, 'readwrite');
        tx.objectStore(this.OS).put(JSON.parse(json), this.KEY);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    // copia espejo en localStorage (segunda red de seguridad)
    try { localStorage.setItem(this.LS, json); } catch (e) {}
  },
};
let S = null; let saveTimer = null;
function persist(now = false) {
  S.updatedAt = Date.now();
  clearTimeout(saveTimer);
  const run = () => Store.save(S).catch(() => toast('No se pudo guardar. Exportá un respaldo.'));
  if (now) return run();
  saveTimer = setTimeout(run, 250);
}
function normalize(st) {
  const d = defaultState();
  st = Object.assign({}, d, st);
  st.blocks = (st.blocks && st.blocks.length) ? st.blocks : d.blocks;
  st.blocks.forEach(b => { b.days = (b.days || []).map(day => Object.assign({intro:''}, day, {exercises:(day.exercises || []).map(E)})); b.running = b.running || seedRunning(); });
  if (!st.blocks.find(b => b.id === st.activeBlockId)) st.activeBlockId = st.blocks[st.blocks.length - 1].id;
  st.sessions = st.sessions || []; st.runs = st.runs || []; st.measurements = st.measurements || []; st.weekMarks = st.weekMarks || {}; st.checkins = st.checkins || []; st.dayRest = st.dayRest || {}; st.boxing = st.boxing || []; st.settings = Object.assign({autoRest:true, sound:true}, st.settings || {});
  st.food = Object.assign({targets:{}, days:{}, foods:[], combos:[]}, st.food || {});
  st.profile = PID; delete st.__migrated;
  if (PID === 'guada') migrateGuadaRoutine(st);
  if (PID === 'guada' && st.food.planId !== FOOD_PLAN_ID) { applyFoodPlan(st.food, GUADA_FOOD_PLAN); st.food.planId = FOOD_PLAN_ID; }
  if (PID === 'guada') st.blocks.forEach(b => b.days.forEach(d => { if (G_OLD_COLORS[d.key] && d.color === G_OLD_COLORS[d.key]) d.color = G_COLORS[d.key]; }));

      const id = en.target.id.slice(3); $$('.exnav button').forEach(b => b.classList.toggle('cur', b.dataset.ex === id));
      const cur = $(`.exnav button[data-ex="${id}"]`); if (cur) nav.scrollTo({left:cur.offsetLeft - nav.clientWidth / 2 + cur.clientWidth / 2, behavior:REDUCE() ? 'auto' : 'smooth'}); }),
      {rootMargin:'-35% 0px -55% 0px'});
    $$('.ex[id^="ex-"]').forEach(el => EXOBS.observe(el));
  }
}
function route() {
  if (!S) return showChooser();
  $('#nav').classList.remove('hide');
  const h = CUR;
  const [view, arg] = h.split('/');
  const map = {inicio:vHome, entrenar:vTrain, comidas:vFood, sesion:vSession, running:vRunning, progreso:vProgress, composicion:vBody, rutina:vRoutine, ajustes:vSettings};

  const navKey = {sesion:'entrenar', running:'entrenar'}[view] || (map[view] ? view : 'inicio');
  renderNav(navKey);
  $('#app').innerHTML = fn(arg);
  window.scrollTo(0, 0); postRender();
}
function rerender() { if (!S) return showChooser(); const y = window.scrollY; const h = CUR; const [view, arg] = h.split('/');
  const map = {inicio:vHome, entrenar:vTrain, comidas:vFood, sesion:vSession, running:vRunning, progreso:vProgress, composicion:vBody, rutina:vRoutine, ajustes:vSettings};

/* --- Sábado de recuperación (perfil Priscila) --- */
function satPanel(onColor) {
  const ws = weekStatus(); const rec = recoveryThisWeek(); const missed = ws.filter(x => x.st === 'missed');
  const mon = mondayOf(todayISO()); const satMark = (S.weekMarks[mon] || {}).sat;
  const B = onColor ? 'btn' : 'btn soft';
  if (rec) {
    const blk = blockById(rec.blockId) || activeBlock(); const d = dayOf(blk, rec.recoveryOf.dayKey) || {name:'', title:''};
    const rest = missed.filter(x => x.day.key !== rec.recoveryOf.dayKey);
    return {k:'Sábado', t:rec.status === 'done' ? `Recuperaste ${d.name.toLowerCase()}` : `Recuperando ${d.name.toLowerCase()}`, d:d.title,
      body:`${rec.status !== 'done' ? `<a class="${B} block" style="margin-top:14px" href="#/sesion/${rec.id}">Continuar entrenamiento</a>` : ''}
      ${rest.length ? `<p class="small" style="margin-top:12px;opacity:.9">${rest.map(x => esc(x.day.name)).join(', ')} ${rest.length > 1 ? 'quedan registrados' : 'queda registrado'} como no realizado${rest.length > 1 ? 's' : ''}. No hace falta compensar todo el volumen.</p>` : ''}`};
  }
  if (!missed.length) {
    return {k:'Sábado', t:'Semana completada', d:satMark === 'rest' ? 'Elegiste descansar. ¡Bien ahí!' : 'Cardio opcional de 30-45 min o descanso.',
      body:`<div class="grid2" style="margin-top:14px"><button class="${B}" style="margin:0" data-act="go-running">${ic('run', 18)} Cardio</button><button class="${B}" style="margin:0" data-act="sat-rest">${ic('moon', 18)} Descanso</button></div>`};
  }
  if (missed.length === 1) {
    const x = missed[0];
    return {k:'Sábado · recuperar entrenamiento', t:`Recuperar ${x.day.name}`, d:x.day.title,
      body:`<button class="${B} block" style="margin-top:14px" data-act="recover" data-day="${x.day.key}" data-date="${x.date}">Recuperar ${esc(x.day.name.toLowerCase())} · ${esc(x.day.title)}</button>
      <p class="small" style="margin-top:10px;opacity:.85">Se repite exactamente la sesión, con fecha de hoy. El cardio del sábado queda para cuando no haya pendientes.</p>`};
  }
  return {k:'Sábado · recuperar entrenamiento', t:'Elegí qué entrenamiento recuperar', d:`Tenés ${missed.length} pendientes: recuperá solo uno.`,
    body:`<div class="stack" style="margin-top:14px">${missed.map(x => `<button class="${B} block" style="margin:0;justify-content:flex-start" data-act="recover" data-day="${x.day.key}" data-date="${x.date}">${esc(x.day.name)} · ${esc(x.day.title)}</button>`).join('')}</div>
    <p class="small" style="margin-top:10px;opacity:.85">Los demás quedan registrados como no realizados. No se suman dos rutinas el mismo día.</p>`};
}
function satHero() { const p = satPanel(true); return `<div class="hero" style="--c:var(--primary)"><div class="k">${esc(p.k)}</div><div class="t">${esc(p.t)}</div><div class="d">${esc(p.d)}</div>${p.body}</div>`; }
function satCard() { const p = satPanel(false); return `<div class="card" style="--c:var(--primary)"><div class="small muted" style="font-weight:700">${esc(p.k)}</div><b style="font-size:19px;display:block;margin-top:2px">${esc(p.t)}</b><div class="muted" style="font-size:14.5px">${esc(p.d)}</div>${p.body}</div>`; }
function showSatSheet() { const p = satPanel(false); openSheet(p.t, `<p class="muted" style="margin-bottom:4px">${esc(p.d)}</p>${p.body}`); }

function showDayStatus(key) {
  const x = weekStatus().find(w => w.day.key === key); if (!x) return;
  const d = x.day;
  const stColor = {done:'var(--ok)', recovered:'var(--ok)', missed:'var(--down)', pending:'var(--mut)'}[x.st];
  openSheet(`${d.name} · ${d.title}`, `<p style="font-size:15.5px"><span class="pill c" style="--c:${stColor}">${ST_LABEL[x.st]}</span>${x.auto ? ' <span class="small muted">· sin registrar</span>' : ''}</p>
    <p class="small muted" style="margin-top:8px">${fmtLong(x.date)}${x.rec ? ` · recuperado el ${fmtDate(x.rec.date)}` : ''}</p>
    <div class="stack" style="margin-top:16px">
      ${x.sess ? `<button class="btn block ghost" data-act="session-view" data-id="${x.sess.id}">${ic('hist', 18)} Ver sesión registrada</button>` : ''}
      ${x.st !== 'done' ? `<button class="btn block" style="background:${d.color}" data-act="start" data-day="${d.key}">Entrenar ${esc(d.name.toLowerCase())} ahora</button>` : ''}
      ${!x.sess && x.mark !== 'done' ? `<button class="btn block soft" style="--c:var(--ok)" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="done">${ic('check', 18)} Marcar como realizado</button>` : ''}
      ${!x.sess && x.mark !== 'missed' && x.st !== 'recovered' ? `<button class="btn block danger" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="missed">${ic('x', 18)} Marcar como no realizado</button>` : ''}
      ${x.mark ? `<button class="linkbtn" style="align-self:center" data-act="mark-day" data-day="${d.key}" data-date="${x.date}" data-v="">Quitar marca</button>` : ''}
    </div>
    <p class="small muted" style="margin-top:12px">“Marcar como realizado” sirve si entrenaste pero no cargaste los datos. Los días pasados sin registro cuentan como no realizados.</p>`);
}

function warmupBlock() {

const recLabel = s => s && s.recoveryOf ? `Recuperación del ${(dayOf(blockById(s.blockId) || activeBlock(), s.recoveryOf.dayKey) || {name:''}).name.toLowerCase()}` : '';

function guideHTMLPriscila() {

  <div class="card"><h4>Pesos iniciales</h4><p>Todos los pesos indicados son <b>orientativos</b>. No tenés que usar necesariamente ese número: durante las primeras sesiones se calibra la carga con técnica, rango de movimiento, repeticiones y RIR.</p></div>
  <div class="banner warn">${ic('gear')}<div><b>Máquinas.</b> Especialmente en máquinas, los kilos no son comparables entre gimnasios: el mismo número puede sentirse muy distinto.</div></div>
  <div class="card"><h4>Progresión</h4><p>Se mantienen los mismos ejercicios durante unas 6 semanas. No se cambian semanalmente: progresan las cargas, las repeticiones y la ejecución.</p>
    <p class="muted" style="margin:8px 0">Ejemplo con 3 × 8-10:</p><div class="stack">
    <div class="progrow" style="--c:var(--ok)"><b>10 / 10 / 10</b><span>Con buena técnica y el RIR previsto → podés aumentar ligeramente la carga en la próxima sesión.</span></div>

/* ---------- Cómo se hace cada ejercicio ----------
   Se busca por nombre, así funciona también con ejercicios editados o nuevos.
   Si un ejercicio tiene pasos propios (campo howto), se usan esos. */
const HOWTO = {
  hipthrust:{w:'Glúteos (principal) e isquiotibiales.', s:['Sentate en el piso con la parte alta de la espalda (justo debajo de los omóplatos) apoyada en el borde de un banco.','Apoyá la barra sobre la cadera con una almohadilla. Pies apoyados al ancho de los hombros y rodillas flexionadas.','Empujá con los talones y subí la cadera hasta que el torso quede paralelo al piso y las rodillas formen un ángulo recto.','Arriba, apretá los glúteos un segundo con el mentón levemente hacia el pecho.','Bajá controlado, sin apoyar del todo la cola en el piso. Si hay máquina de hip thrust, la idea es la misma.'], q:'hip thrust con barra técnica'},
  sent_maquina:{w:'Glúteos y cuádriceps.', s:['Ubicate en la máquina con la espalda apoyada y los hombros debajo de las almohadillas (o la barra guiada sobre los trapecios).','Pies al ancho de los hombros; si la máquina lo permite, apenas adelantados para que trabaje más el glúteo.','Destrabá y bajá controlado hasta una buena profundidad, sin rebotar abajo.','Subí empujando con todo el pie, sin acortar el recorrido para mover más peso.'], q:'sentadilla en máquina técnica glúteos'},
  hack:{w:'Cuádriceps y glúteos.', s:['Es una máquina con respaldo inclinado y almohadillas para los hombros.','Apoyá la espalda y la cadera en el respaldo, con los hombros debajo de las almohadillas.','Pies en la plataforma al ancho de la cadera. Destrabá los seguros.','Bajá flexionando las rodillas hasta donde puedas mantener la espalda apoyada (idealmente muslos paralelos a la plataforma o más).','Subí empujando con todo el pie, sin trabar las rodillas arriba. Si no hay hack, la alternativa es la sentadilla con barra sobre los trapecios.'], q:'hack squat máquina técnica'},
  bulgara:{w:'Glúteos y cuádriceps.', s:['Parate de espaldas a un banco y apoyá el empeine de un pie atrás, sobre el banco.','Adelantá el otro pie: un paso largo carga más el glúteo; uno corto, más el cuádriceps.','Con una mancuerna en cada mano, inclinate apenas hacia adelante.','Bajá flexionando la rodilla de adelante hasta que el muslo quede casi paralelo al piso. La rodilla de atrás va hacia el piso.','Subí empujando con el talón de la pierna de adelante. Hacé todas las repeticiones y recién ahí cambiá de pierna.'], q:'sentadilla búlgara glúteo técnica'},
  bulgara_smith:{w:'Glúteos y cuádriceps.', s:['Poné un banco detrás de la máquina Smith y apoyá la barra sobre los trapecios.','Apoyá el empeine de un pie atrás, sobre el banco, y adelantá el otro pie.','Destrabá la barra y bajá flexionando la rodilla de adelante, en línea recta, hasta que el muslo quede casi paralelo al piso.','Subí empujando con la pierna de adelante, sin apoyarte en la de atrás.','Hacé todas las repeticiones con una pierna y después cambiá.'], q:'sentadilla búlgara en smith técnica'},
  prensa:{w:'Cuádriceps y glúteos.', s:['Sentate con la espalda y la cola bien apoyadas en el respaldo.','Pies en el centro de la plataforma, al ancho de los hombros.','Destrabá los seguros y bajá la plataforma flexionando las rodillas hasta unos 90°, o hasta donde puedas sin despegar la cola.','Empujá con todo el pie para subir, sin trabar las rodillas arriba.'], q:'prensa de piernas técnica'},
  prensa_altos:{w:'Glúteos e isquiotibiales (más que la prensa común).', s:['Sentate con la espalda y la cola bien apoyadas.','Apoyá los pies más arriba en la plataforma que en la prensa común, al ancho de los hombros.','Destrabá y bajá flexionando rodillas y cadera, sin que la cola se despegue del respaldo.','Empujá con los talones para subir, sin trabar las rodillas.'], q:'prensa pies altos glúteos técnica'},
  gemelos_prensa:{w:'Pantorrillas (gemelos).', s:['Sentate en la prensa y apoyá solo la parte delantera de los pies (debajo de los dedos) en el borde inferior de la plataforma, con los talones afuera.','Extendé las piernas sin trabar las rodillas.','Empujá con las puntas de los pies, estirando los tobillos al máximo.','Volvé dejando que los talones bajen bien para estirar. Cuidá que los pies no se resbalen.'], q:'gemelos en prensa técnica'},
  ext_cuad:{w:'Cuádriceps (frente del muslo).', s:['Sentate con la espalda apoyada y la rodilla alineada con el eje de giro de la máquina.','El rodillo va sobre la parte baja de la canilla, arriba del tobillo.','Estirá las piernas hasta casi extenderlas del todo y apretá un segundo.','Bajá lento.'], q:'extensión de cuádriceps máquina técnica'},
  curl_fem:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Según la máquina, se hace acostada boca abajo o sentada.','Las rodillas quedan alineadas con el eje de giro y el rodillo, sobre la parte de atrás de los tobillos.','Flexioná las rodillas llevando los talones hacia la cola, sin levantar la cadera.','Volvé lento hasta casi estirar.'], q:'curl femoral máquina técnica'},
  curl_fem_acostada:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Acostate boca abajo en la máquina, con las rodillas justo pasando el borde del banco.','El rodillo va sobre la parte de atrás de los tobillos. Agarrate de las manijas.','Flexioná las rodillas llevando los talones hacia la cola, sin despegar la cadera del banco.','Volvé lento hasta casi estirar.'], q:'curl femoral acostado técnica'},
  curl_fem_sentada:{w:'Isquiotibiales (parte de atrás del muslo).', s:['Sentate con la espalda apoyada, la rodilla alineada con el eje y el rodillo de arriba trabando el muslo.','Apoyá la parte de atrás del tobillo de una pierna sobre el rodillo de abajo.','Flexioná la rodilla llevando el talón hacia abajo y atrás.','Volvé lento. Hacé todas las repeticiones y cambiá de pierna.'], q:'curl femoral sentado unilateral técnica'},
  abduccion:{w:'Glúteo medio (costado de la cola). Abducción = alejar la pierna del centro del cuerpo.', s:['En la máquina: sentate con la espalda apoyada y las almohadillas del lado de afuera de las rodillas.','Abrí las piernas hacia los costados empujando con la parte externa de las rodillas.','Pausá un segundo con las piernas abiertas.','Cerrá lento, sin que las placas choquen.','En polea: tobillera en la polea baja, parada de costado, y llevás la pierna más lejana hacia afuera.'], q:'abducción de cadera máquina técnica'},
  aduccion:{w:'Aductores (parte interna del muslo). Aducción = acercar la pierna al centro del cuerpo.', s:['Sentate con la espalda apoyada y las almohadillas del lado de adentro de las rodillas.','Arrancás con las piernas abiertas.','Cerrá las piernas apretando hacia el centro.','Abrí lento hasta la posición inicial.'], q:'aducción de cadera máquina técnica'},
  elev_piernas:{w:'Abdomen, sobre todo la parte baja.', s:['En silla romana: antebrazos apoyados, espalda contra el respaldo y el cuerpo colgando.','Subí las piernas (rectas o apenas flexionadas) hasta unos 90°.','Al subir, enrollá la pelvis hacia adelante: la cola se despega un poco del respaldo.','Bajá controlado, sin balancearte.','En paralelas es igual, pero sosteniéndote con los brazos extendidos.'], q:'elevación de piernas silla romana técnica'},
  elev_rodillas:{w:'Abdomen.', s:['Colgada de una barra, o en silla romana con los antebrazos apoyados.','Llevá las rodillas flexionadas hacia el pecho.','Arriba, enrollá la pelvis hacia adelante.','Bajá controlado, sin balancearte.'], q:'elevación de rodillas colgado técnica'},
  situp:{w:'Abdomen.', s:['Sentate en el banco declinado con los pies trabados debajo de los rodillos.','Sostené un disco contra el pecho con los brazos cruzados.','Bajá controlado hasta casi apoyar la espalda.','Subí enrollando el tronco hasta quedar sentada. No tironees del cuello.'], q:'sit up banco declinado con peso técnica'},
  jalon:{w:'Dorsales (espalda) y bíceps.', s:['Sentate con los muslos trabados debajo de los rodillos.','Agarrá la barra o las manijas con los brazos estirados. En agarre neutro, las palmas se miran entre sí.','Sacá pecho e inclinate apenas hacia atrás.','Tirá llevando los codos hacia abajo y atrás hasta que las manos lleguen a la parte alta del pecho.','Subí lento, estirando los brazos.'], q:'jalón al pecho agarre neutro técnica'},
  remo_sentado:{w:'Espalda media y dorsales.', s:['Sentate con el pecho apoyado en el respaldo, o con los pies en la plataforma si es en polea.','Agarrá las manijas con los brazos estirados y la espalda recta.','Tirá llevando los codos hacia atrás, pegados al cuerpo, y juntá los omóplatos.','Volvé lento estirando los brazos, sin encorvarte.'], q:'remo sentado polea técnica'},
  remo_barra:{w:'Espalda media y dorsales.', s:['Con barra: inclinate desde la cadera a unos 45°, espalda recta y rodillas apenas flexionadas.','Dejá la barra colgando con los brazos estirados.','Tirá la barra hacia el ombligo llevando los codos hacia atrás.','Bajá lento. Si es en polea, se hace como el remo sentado.'], q:'remo con barra técnica'},
  remo_brazo:{w:'Dorsales y espalda media.', s:['Apoyá una mano y la rodilla del mismo lado en un banco, con la espalda paralela al piso.','Con la otra mano sostené la mancuerna, con el brazo estirado.','Tirá llevando el codo hacia atrás y arriba, en dirección a la cadera.','Bajá estirando el brazo, sin girar el torso.'], q:'remo a un brazo con mancuerna técnica'},
  remo_inv:{w:'Espalda y bíceps. Es la base para llegar a la dominada.', s:['Poné la barra de la Smith más o menos a la altura de la cintura, o usá un TRX.','Agarrate y caminá con los pies hacia adelante hasta quedar inclinada, con el cuerpo recto de la cabeza a los talones.','Tirá llevando el pecho hacia la barra y juntando los omóplatos.','Bajá lento. Cuanto más vertical estés, más fácil; cuanto más horizontal, más difícil.'], q:'remo invertido smith técnica'},

/* ---------- Chequeo de recuperación y ajuste automático del plan ----------
   Solo modifica la sesión del día (nunca la rutina). Reglas, en línea con la guía:
   priorizar bajar volumen antes que agregar; con molestias articulares, ajuste fuerte. */
const CHECK_Q = [
  {k:'sleep', q:'¿Cómo dormiste?', o:['Bien', 'Regular', 'Mal'], r:['', 'dormiste regular', 'dormiste mal']},
  {k:'energy', q:'¿Cómo está tu energía?', o:['Bien', 'Regular', 'Baja'], r:['', 'energía regular', 'energía baja']},
  {k:'sore', q:'¿Cómo sentís el cuerpo?', o:['Liviano', 'Cargado', 'Muy pesado'], r:['', 'cuerpo cargado', 'cuerpo muy pesado']},
  {k:'joint', q:'¿Molestias articulares?', o:['No', 'Leves', 'Sí'], r:['', 'molestias articulares leves', 'molestias articulares']},
];
const ADJ_LABEL = {normal:'Plan normal', leve:'Ajuste leve', fuerte:'Ajuste fuerte'};
function evalCheckin(a, date = todayISO()) {
  let score = 0; const reasons = [];
  CHECK_Q.forEach(q => { const v = a[q.k] || 0; score += v; if (v) reasons.push(q.r[v]); });
  const yest = addDays(date, -1);
  if (PROFILE.boxing && (S.boxing || []).some(b => b.date === yest && b.intensity === 'alta')) { score += 1; reasons.push('boxeo intenso ayer'); }
  const prev = (S.checkins || []).filter(c => c.date < date).slice(-2);
  if (prev.length === 2 && prev.every(c => c.level !== 'normal') && score > 0) { score += 1; reasons.push('varios días seguidos con baja recuperación'); }
  let level = score <= 2 ? 'normal' : score <= 4 ? 'leve' : 'fuerte';
  if (a.joint === 2) level = 'fuerte';
  return {score, level, reasons, joint:a.joint || 0};
}
function adjustSummary(level) {
  if (level === 'leve') return ['Una serie menos en los ejercicios grandes (de 3-4 series).', 'Cargas y RIR como siempre.'];
  if (level === 'fuerte') return ['Una serie menos en todos los ejercicios de 3-4 series.', 'Carga sugerida un 10% más baja que tu última sesión.', 'Un RIR más de margen (terminá más lejos del fallo).', 'Ejercicios opcionales: hoy se omiten.'];
  return ['Entrenás según lo previsto.'];
}
const adjOn = s => !!(s && s.adjust && s.adjust.active && s.adjust.level !== 'normal');
function shiftRir(r, plus) { if (!r) return r; return String(r).replace(/\d+/g, n => String(+n + plus)); }
/* Ejercicio tal como hay que hacerlo hoy (ajustado o no) */
function effEx(ex, s) {
  if (!adjOn(s)) return ex;
  const L = s.adjust.level;
  const sets = (L === 'leve' ? ex.kind === 'compound' && ex.sets >= 3 : ex.sets >= 3) ? ex.sets - 1 : ex.sets;
  const R = rirInfo(ex);
  return {...ex, sets, setsMin:ex.setsMin ? Math.min(ex.setsMin, sets) : null, rir:L === 'fuerte' && R.label ? shiftRir(R.label, 1) : ex.rir,
    __adj:{setsFrom:ex.sets, loadPct:L === 'fuerte' ? 0.9 : 1, rirFrom:R.label}};
}
const skipToday = (ex, s) => adjOn(s) && s.adjust.level === 'fuerte' && ex.optional;
const roundLoad = w => Math.round(w * 2) / 2;
let CK = null;
function openCheckin(dayKey, recoveryOf) {
  CK = {dayKey, recoveryOf, a:{}};
  const day = dayOf(activeBlock(), dayKey);
  openSheet('¿Cómo llegás hoy?', `<p class="small muted" style="margin-top:-4px">4 toques. Si hace falta, la app ajusta solo la sesión de hoy y te avisa.</p><div id="ckbody"></div>
    <div class="stack" style="margin-top:14px"><button class="btn block" style="background:${day.color}" data-act="ck-go" id="ckgo" disabled>Empezar ${esc(day.name.toLowerCase())}</button>
    <button class="linkbtn" style="align-self:center" data-act="ck-skip">Saltar chequeo y entrenar normal</button></div>`, () => renderCheckin());
}
function renderCheckin() {
  const box = $('#ckbody'); if (!box || !CK) return; const day = dayOf(activeBlock(), CK.dayKey);
  const all = CHECK_Q.every(q => CK.a[q.k] != null); const r = all ? evalCheckin(CK.a) : null;
  box.innerHTML = CHECK_Q.map(q => `<div style="margin-top:12px"><div class="lbl"><span>${q.q}</span></div>
    <div class="seg" style="--c:${day.color}">${q.o.map((o, i) => `<button class="${CK.a[q.k] === i ? 'on' : ''}" data-act="ck" data-k="${q.k}" data-v="${i}" ${CK.a[q.k] === i && i ? `style="color:${i === 2 ? 'var(--down)' : 'var(--warn-ink)'}"` : ''}>${o}</button>`).join('')}</div></div>`).join('')
    + (r ? `<div class="banner ${r.level === 'normal' ? 'info' : 'warn'}" style="margin-top:14px;--c:var(--ok)">${ic(r.level === 'normal' ? 'check' : 'warn')}<div><b>${ADJ_LABEL[r.level]}</b>${r.reasons.length && r.level !== 'normal' ? ` · por ${esc(r.reasons.join(', '))}` : ''}<ul style="margin:6px 0 0 16px">${adjustSummary(r.level).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      ${r.joint ? `<p style="margin-top:6px"><b>Molestias articulares:</b> si son punzantes, irradiadas o empeoran durante un ejercicio, no lo hagas.</p>` : ''}</div></div>` : '');
  const go = $('#ckgo'); if (go) go.disabled = !all;
}
function finishCheckin(skip) {
  if (!CK) return; const {dayKey, recoveryOf, a} = CK;
  let adjust = null;
  if (!skip) {
    const r = evalCheckin(a);
    S.checkins = S.checkins || []; S.checkins.push({date:todayISO(), dayKey, ...a, score:r.score, level:r.level});
    adjust = {level:r.level, active:r.level !== 'normal', reasons:r.reasons, joint:r.joint};
  }
  CK = null; closeSheet(true); createSession(dayKey, recoveryOf, adjust);
  if (adjust && adjust.active) setTimeout(() => toast(`${ADJ_LABEL[adjust.level]} aplicado a la sesión de hoy`), 350);
}
function adjustBanner(s) {
  if (!s.adjust || s.adjust.level === 'normal') return '';
  const on = adjOn(s);
  return `<div class="banner warn" style="margin-bottom:10px">${ic('warn')}<div style="flex:1"><b>${on ? `${ADJ_LABEL[s.adjust.level]} por tu recuperación` : 'Plan original (ajuste desactivado)'}</b>
    ${on ? `${s.adjust.reasons.length ? `<div class="small">Motivo: ${esc(s.adjust.reasons.join(', '))}.</div>` : ''}<ul style="margin:6px 0 0 16px;font-size:14px">${adjustSummary(s.adjust.level).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    ${s.adjust.joint && on ? `<div class="small" style="margin-top:6px"><b>Molestias articulares:</b> si son punzantes, irradiadas o empeoran con un ejercicio, no lo hagas.</div>` : ''}
    <button class="linkbtn" style="padding-left:0;color:var(--warn-ink)" data-act="adj-toggle" data-id="${s.id}">${on ? 'Usar el plan original' : 'Volver a aplicar el ajuste'}</button></div></div>`;
}

/* ---------- Temporizador de descanso ---------- */
function restFor(ex) {
  if (num(ex.rest)) return num(ex.rest);
  if (ex.section === 'core') return 60;
  if (ex.kind === 'compound') return /hip thrust|peso muerto|hack|prensa|sentadilla|buenos dias|bulgara/.test(normName(ex.name)) ? 150 : 120;
  return 75;
}
let REST = null, ACTX = null;
function unlockAudio() { try { if (!ACTX) ACTX = new (window.AudioContext || window.webkitAudioContext)(); if (ACTX.state === 'suspended') ACTX.resume(); } catch (e) {} }
function beep() {
  if (!S || S.settings.sound === false || !ACTX) return;
  try { [0, 0.28, 0.56].forEach(t => { const o = ACTX.createOscillator(), g = ACTX.createGain(); o.frequency.value = t > 0.5 ? 1175 : 880; o.connect(g); g.connect(ACTX.destination);
    const t0 = ACTX.currentTime + t; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2); o.start(t0); o.stop(t0 + 0.22); }); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function restEl() {
  let el = $('#rest');

  return el;
}
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.max(0, Math.floor(s % 60)))}`;
function startRest(sec, label, color) {
  stopRest(true); unlockAudio();
  REST = {end:Date.now() + sec * 1000, total:sec, label, color:color || 'var(--primary)', done:false};
  const el = restEl(); el.className = 'on'; el.style.setProperty('--c', REST.color);
  REST.timer = setInterval(tickRest, 250); tickRest();
}
function tickRest() {
  if (!REST) return; const el = restEl(); const left = Math.max(0, (REST.end - Date.now()) / 1000);
  if (left <= 0 && !REST.done) { REST.done = true; beep(); el.classList.add('done'); setTimeout(() => stopRest(), 5000); }
  const pct = REST.done ? 1 : 1 - left / REST.total;
  el.innerHTML = REST.done ? `<span class="rest-ring">${ic('check', 18)}</span><div class="rest-tx"><b>¡A la próxima serie!</b><span>${esc(REST.label)}</span></div><button data-act="rest-stop" aria-label="Cerrar">${ic('x', 18)}</button>`

/* ---------- Balance energético del día ----------
   Gasto total = metabolismo basal × actividad diaria (fuera del entrenamiento) + entrenamiento neto.
   Metabolismo basal: Katch-McArdle si hay masa adiposa (usa la masa magra); si no, Mifflin-St Jeor.
   Entrenamiento neto = gasto estimado − lo que igual se habría gastado en reposo (1 MET), para no contarlo dos veces. */
const BODY_DEFAULT = {guada:{height:164, age:25, sex:'f'}, priscila:{height:171, age:25, sex:'f'}};
const ACT_LEVELS = [[1.2, 'Sedentaria (trabajo de escritorio, poco movimiento)'], [1.3, 'Algo activa (escritorio + caminatas diarias)'], [1.45, 'Activa (de pie o caminando gran parte del día)']];

function bmrAt(date) {
  const ms = sortedMeas().filter(m => m.weight != null); const before = ms.filter(m => m.date <= date);
  const m = (before.length ? before : ms).slice(-1)[0]; if (!m) return null;
  const B = bodyCfg();
  if (m.fatKg != null && m.fatKg > 0 && m.fatKg < m.weight) return {bmr:370 + 21.6 * (m.weight - m.fatKg), method:'Katch-McArdle (con tu masa magra)', w:m.weight};
  const base = 10 * m.weight + 6.25 * B.height - 5 * B.age;
  return {bmr:B.sex === 'm' ? base + 5 : base - 161, method:'Mifflin-St Jeor (peso, altura y edad)', w:m.weight};
}
function dayActivities(date) {
  const out = [];
  S.sessions.filter(x => x.status === 'done' && x.date === date).forEach(x => { const k = sessionKcal(x); if (!k) return; const d = dayOf(blockById(x.blockId) || activeBlock(), x.dayKey) || {name:'Gimnasio'};
    out.push({label:'Gimnasio · ' + d.name, kcal:k.kcal, min:k.min + (x.cardio && num(x.cardio.minutes) ? num(x.cardio.minutes) : 0), color:d.color}); });
  (S.boxing || []).filter(b => b.date === date).forEach(b => { const k = boxKcal(b); if (k) out.push({label:'Boxeo', kcal:k.kcal, min:b.duration || 0, color:BOX_COLOR}); });
  S.runs.filter(r => r.date === date).forEach(r => { const k = runKcal(r); if (k) out.push({label:r.activity || PROFILE.cardioLabel, kcal:k.kcal, min:r.duration || 0, color:DAY_COLORS.run}); });
  return out;
}
function dayBalance(date) {
  const items = dayItemsOf(date); const intake = totalsOf(items);
  const B = bmrAt(date); if (!B) return {noWeight:true, intake, foodCount:items.length};
  const cfg = bodyCfg(); const base = B.bmr * cfg.act;
  const acts = dayActivities(date).map(a => ({...a, net:Math.max(0, a.kcal - B.w * (a.min / 60))}));
  const exercise = acts.reduce((s, a) => s + a.net, 0);
  const burn = base + exercise;
  return {intake, foodCount:items.length, bmr:B.bmr, method:B.method, act:cfg.act, base, nonEx:base - B.bmr, acts, exercise, burn, balance:intake.kcal - burn};
}
const k10 = n => (Math.round(n / 10) * 10).toLocaleString('es-AR');
function balanceChart(days) {
  const vals = days.map(d => d.b && d.b.foodCount ? d.b.balance : null);
  const max = Math.max(300, ...vals.filter(v => v != null).map(v => Math.abs(v)));
  const W = 340, H = 170, mid = 85, bw = 30, gap = (W - 7 * bw) / 8;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Balance de los últimos 7 días">
    <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-width="1.5"/>
    ${days.map((d, i) => { const x = gap + i * (bw + gap); const v = vals[i];
      if (v == null) return `<rect x="${x}" y="${mid - 2}" width="${bw}" height="4" rx="2" fill="var(--track)"/><text class="ax" x="${x + bw / 2}" y="${H + 16}" text-anchor="middle">${WD3[parseISO(d.date).getDay()]}</text>`;
      const h = Math.max(3, Math.abs(v) / max * (mid - 14)); const y = v < 0 ? mid : mid - h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${v < 0 ? 'var(--primary)' : '#D98A2B'}"><title>${k10(v)} kcal</title></rect>
        <text class="ax" x="${x + bw / 2}" y="${v < 0 ? y + h + 12 : y - 4}" text-anchor="middle" style="font-size:10px">${v < 0 ? '−' : '+'}${k10(Math.abs(v))}</text>
        <text class="ax" x="${x + bw / 2}" y="${H + 16}" text-anchor="middle">${WD3[parseISO(d.date).getDay()]}</text>`; }).join('')}

}

      <p class="small muted" style="margin-top:8px">Como referencia, unas 7.700 kcal de déficit equivalen aproximadamente a 1 kg de grasa. Es orientativo: el agua, la sal y el ciclo mueven mucho el peso de un día a otro.</p>

/* --- Progreso --- */
function vProgress() {

      if (!e.saved) return; const k = e.exId; if (!map.has(k)) map.set(k, {exId:k, name:e.name, items:[], dayKey:s.dayKey});
      map.get(k).items.push({...e, date:s.date});
    }));
    const groups = [...map.values()].map(g => (g.items.sort((a, b) => a.date.localeCompare(b.date)), g));
    const order = activeBlock().days.flatMap(d => d.exercises.map(e => e.id));

    }).join('')}</div>` : `<div class="empty"><b>Todavía no hay ejercicios registrados</b>Guardá ejercicios en un entrenamiento y vas a ver su evolución acá.</div>`;
  } else {
    const ss = sessionsSorted().filter(s => s.status === 'done' && inBlock(s));
    const rs = S.runs.filter(r => filter === 'all' || r.blockId === filter);
    const bs = PROFILE.boxing ? (S.boxing || []).filter(b => filter === 'all' || b.blockId === filter) : [];
    const total = ss.length + rs.length + bs.length;
    const mon = mondayOf(todayISO()); const wk = Array.from({length:7}, (_, i) => addDays(mon, i)).reduce((a, d) => a + dayTrainingKcal(d), 0);
    body = `<div class="grid3" style="margin-bottom:8px"><div class="metric"><div class="l">Gimnasio</div><div class="v">${ss.length}</div></div><div class="metric"><div class="l">${esc(PROFILE.cardioLabel)}</div><div class="v">${rs.length}</div></div><div class="metric"><div class="l">Total</div><div class="v">${total}</div></div></div>
    ${wk ? `<div class="metric" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><div><div class="l">Gasto en entrenamientos esta semana</div><div class="v">≈ ${(Math.round(wk / 10) * 10).toLocaleString('es-AR')}<small>kcal</small></div></div><span class="small muted" style="text-align:right">estimado,<br>solo lo registrado</span></div>` : ''}`;
    body += total ? recentListFiltered(ss, rs, bs) : `<div class="empty"><b>Sin sesiones</b>Finalizá un entrenamiento para verlo acá.</div>`;
  }

  <div class="blockchips" style="margin:12px 0;${UI.progTab === 'balance' ? 'display:none' : ''}">${[['all', 'Todos los bloques']].concat(blocks.map(b => [b.id, b.name])).map(([id, n]) => `<button class="${filter === id ? 'on' : ''}" data-act="prog-block" data-v="${id}">${esc(n)}</button>`).join('')}</div>

const boxRow = b => `<button class="listrow" style="--c:${BOX_COLOR}" data-act="box-edit" data-id="${b.id}"><span class="bar"></span><span class="mid"><b>Boxeo</b><span>${fmtDate(b.date)}${b.duration ? ' · ' + b.duration + ' min' : ''}${b.type ? ' · ' + esc(b.type) : ''}${boxKcal(b) ? ' · ' + kcalTxt(boxKcal(b)) : ''}</span></span>${ic('right')}</button>`;

function showHistory(exId) {
  const ex = findExercise(exId);
  const name = ex?.name || entriesFor(e => e.exId === exId)[0]?.name || 'Ejercicio';
  const list = entriesFor(e => e.exId === exId);
  const others = ex ? entriesFor(e => e.exId !== exId && normName(e.name) === normName(name)) : [];
  const color = ex ? (DAY_COLORS[dayKeyOfExercise(exId)] || 'var(--primary)') : 'var(--primary)';
  const withW = list.filter(e => e.weight != null);
  const first = withW[0], last = withW[withW.length - 1];
  let trend = '';
  if (first && last && withW.length > 1) { const d = last.weight - first.weight; trend = `<div class="trend"><span class="pill">Primera: ${fmtN(first.weight)} kg</span><span class="pill">Última: ${fmtN(last.weight)} kg</span><span class="pill c" style="--c:${d >= 0 ? 'var(--ok)' : 'var(--down)'}">${d >= 0 ? '+' : ''}${fmtN(d)} kg</span></div>`; }
  const sumReps = e => (e.reps || []).reduce((a, r) => a + (num(r) || 0), 0);
  list.forEach((e, i) => { e.__prev = list[i - 1] || null; });
  const cmp = e => { const p = e.__prev; if (!p) return ''; const parts = [];
    if (e.weight != null && p.weight != null) { const dw = e.weight - p.weight; parts.push(Math.abs(dw) < .01 ? 'mismo peso' : `${dw > 0 ? '+' : ''}${fmtN(dw)} kg`); }
    const dr = sumReps(e) - sumReps(p); parts.push(dr === 0 ? 'mismas reps totales' : `${dr > 0 ? '+' : ''}${dr} reps totales`);
    const up = (e.weight ?? 0) > (p.weight ?? 0) || ((e.weight ?? 0) === (p.weight ?? 0) && dr > 0);
    return `<div class="n" style="color:${up ? 'var(--ok)' : 'var(--mut)'};font-weight:650">vs. anterior: ${parts.join(' · ')}</div>`; };
  const row = e => { const blk = blockById(e.blockId); const day = blk ? dayOf(blk, e.dayKey) : null;
    return `<div class="hrow"><div class="top"><b>${fmtDate(e.date)}</b><span class="small muted">${esc(day?.name || '')}${e.recoveryOf ? ' · recuperación' : ''}${blk ? ' · ' + esc(blk.name) : ''}</span></div>
      <div class="reps">${e.weight != null ? fmtN(e.weight) + ' kg' : 'Sin carga'}<small>${esc(entryReps(e))}${e.rir != null ? ' · RIR ' + rirTxt(e.rir) : ''}</small></div>${cmp(e)}${e.notes ? `<div class="n">${esc(e.notes)}</div>` : ''}</div>`; };

    ${trend}
    ${list.length ? `<div class="hist" style="margin-top:10px">${[...list].reverse().map(row).join('')}</div>` : `<div class="empty" style="margin-top:10px"><b>Sin registros</b>Guardá este ejercicio en un entrenamiento.</div>`}
    ${others.length ? `<div class="section-title" style="font-size:16px">Mismo ejercicio en otro día</div><div class="hist">${[...others].reverse().slice(0, 8).map(row).join('')}</div>` : ''}`;
  openSheet(name, body);
}
function findExercise(exId) { for (const b of [activeBlock(), ...S.blocks]) for (const d of b.days) { const e = d.exercises.find(x => x.id === exId); if (e) return e; } return null; }
function dayKeyOfExercise(exId) { for (const b of [activeBlock(), ...S.blocks]) for (const d of b.days) if (d.exercises.some(x => x.id === exId)) return d.key; return null; }

}
